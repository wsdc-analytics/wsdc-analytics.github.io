<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intermediate Leader — прогноз доли secondary-поинтов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --surface-card: #ffffff;
      --text: #2c2f30;
      --muted-soft: #abadae;
      --border: rgba(117, 119, 120, 0.16);
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius-outer: 30px;
      --fact-line: #d97706;
      --fact-fill: rgba(217, 119, 6, 0.12);
      --fact-fill-border: rgba(217, 119, 6, 0.24);
      --central-line: #475569;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text);
    }
    .chart-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      background: var(--surface-card);
      box-shadow: var(--shadow);
      padding: 12px 14px 12px;
      overflow: visible;
    }
    .chart-embed-title {
      font-size: 10px;
      font-weight: 800;
      color: var(--muted-soft);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin: 0 0 8px 2px;
    }
    .chart-legend { width: 100%; margin-bottom: 4px; }
    .legend {
      display: flex;
      gap: 8px;
      margin: 0;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #5b6063;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #f7f8f9;
      border: 1px solid rgba(117, 119, 120, 0.14);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .legend-line {
      width: 10px;
      height: 2px;
      background: transparent;
      display: inline-block;
      box-sizing: border-box;
    }
    .legend-line.fact { border-top: 2px solid var(--fact-line); }
    .legend-line.central { border-top: 2px dashed var(--central-line); }
    .legend-line.band {
      height: 8px;
      width: 12px;
      border-radius: 2px;
      background: var(--fact-fill);
      border: 1px solid var(--fact-fill-border);
    }
    .chart-canvas-box {
      margin: 4px 0 0;
      padding: 6px 4px 8px;
      border-radius: 12px;
      background: #ffffff;
      overflow: visible;
      position: relative;
      width: 100%;
      height: 252px;
      min-height: 252px;
      box-sizing: border-box;
    }
    .chartjs-ext-tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(117, 119, 120, 0.24);
      border-radius: 12px;
      padding: 10px 12px;
      pointer-events: none;
      left: 0;
      top: 0;
      min-width: 168px;
      max-width: min(340px, 92vw);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      z-index: 10;
    }
    .chartjs-ext-tooltip .tt-title {
      font-size: 11px;
      font-weight: 700;
      color: #2c2f30;
      margin: 0 0 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .chartjs-ext-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 12px;
      line-height: 1.35;
      margin: 2px 0;
    }
    .chartjs-ext-tooltip .tt-label { font-weight: 600; }
    .chartjs-ext-tooltip .tt-value { margin-left: auto; font-weight: 700; text-align: right; }
  </style>
</head>
<body>
  <div class="chart-wrap">
    <div class="chart-embed-title">Intermediate Leader</div>
    <div class="chart-legend">
      <div class="legend">
        <span class="legend-item"><span class="legend-line fact"></span>Факт (2021–2026)</span>
        <span class="legend-item"><span class="legend-line central"></span>Линейный тренд</span>
        <span class="legend-item"><span class="legend-line band"></span>Минимум и максимум прогноза</span>
      </div>
    </div>
    <div class="chart-canvas-box">
      <canvas id="chart"></canvas>
    </div>
  </div>
  <script>
    function getOrCreateTooltip(chart) {
      let tooltipEl = chart.canvas.parentNode.querySelector(".chartjs-ext-tooltip");
      if (!tooltipEl) {
        tooltipEl = document.createElement("div");
        tooltipEl.className = "chartjs-ext-tooltip";
        chart.canvas.parentNode.style.position = "relative";
        chart.canvas.parentNode.appendChild(tooltipEl);
      }
      return tooltipEl;
    }

    const YEARS = ["2021","2022","2023","2024","2025","2026","2027","2028","2029","2030","2031","2032","2033","2034","2035","2036"];
    const FACT = [1.49,3.38,5.42,8.09,11.21,15.85,null,null,null,null,null,null,null,null,null,null];
    const CENTRAL = [null,null,null,null,null,14.57,17.37,20.16,22.96,25.76,28.56,31.36,34.15,36.95,39.75,42.55];
    const LOW = [null,null,null,null,null,14.57,17.25,18.65,20.05,21.45,22.84,24.24,25.64,27.04,28.44,29.84];
    const HIGH = [null,null,null,null,null,15.85,18.23,20.96,24.1,27.72,31.88,36.66,42.16,48.48,55.75,64.12];

    const ctx = document.getElementById("chart");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: YEARS,
        datasets: [
          { label: "Факт", data: FACT, borderColor: "#d97706", backgroundColor: "#d97706", borderWidth: 1.8, tension: 0.35, cubicInterpolationMode: "monotone", pointRadius: 0, pointHoverRadius: 3, pointBackgroundColor: "#ffffff", pointBorderColor: "#b45309", pointBorderWidth: 1.2 },
          { label: "Линейный тренд", data: CENTRAL, borderColor: "#475569", backgroundColor: "#475569", borderWidth: 1.5, borderDash: [5, 4], tension: 0.35, cubicInterpolationMode: "monotone", pointRadius: 0, pointHoverRadius: 3, pointBackgroundColor: "#ffffff", pointBorderColor: "#475569", pointBorderWidth: 1.2 },
          { label: "Минимум прогноза", data: LOW, borderColor: "rgba(217,119,6,0)", backgroundColor: "rgba(217,119,6,0)", borderWidth: 0, pointRadius: 0, tension: 0.35, cubicInterpolationMode: "monotone" },
          { label: "Максимум прогноза", data: HIGH, borderColor: "rgba(217,119,6,0)", backgroundColor: "rgba(217,119,6,0.12)", borderWidth: 0, pointRadius: 0, fill: "-1", tension: 0.35, cubicInterpolationMode: "monotone" }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 6, right: 8, bottom: 18, left: 2 } },
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            external: ({ chart, tooltip }) => {
              const tooltipEl = getOrCreateTooltip(chart);
              if (tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                tooltipEl.style.transform = "";
                return;
              }
              const year = tooltip.title && tooltip.title.length ? tooltip.title[0] : "";
              const dps = tooltip.dataPoints || [];
              const byIdx = Object.fromEntries(dps.map((dp) => [dp.datasetIndex, dp]));
              const parts = [];
              if (byIdx[0]) {
                const v = byIdx[0].parsed.y;
                const t = (v == null || Number.isNaN(v)) ? "—" : `${Number(v).toFixed(1)}%`;
                parts.push(`<div class="tt-row" style="color:#d97706"><span class="tt-label">Факт</span><span class="tt-value">${t}</span></div>`);
              }
              if (byIdx[1]) {
                const v = byIdx[1].parsed.y;
                const t = (v == null || Number.isNaN(v)) ? "—" : `${Number(v).toFixed(1)}%`;
                parts.push(`<div class="tt-row" style="color:#475569"><span class="tt-label">Линейный тренд</span><span class="tt-value">${t}</span></div>`);
              }
              const lo = byIdx[2]?.parsed?.y;
              const hi = byIdx[3]?.parsed?.y;
              if (lo != null && !Number.isNaN(lo)) {
                parts.push(`<div class="tt-row" style="color:#92400e"><span class="tt-label">Минимум прогноза</span><span class="tt-value">${Number(lo).toFixed(1)}%</span></div>`);
              }
              if (hi != null && !Number.isNaN(hi)) {
                parts.push(`<div class="tt-row" style="color:#b45309"><span class="tt-label">Максимум прогноза</span><span class="tt-value">${Number(hi).toFixed(1)}%</span></div>`);
              }
              tooltipEl.innerHTML = `<div class="tt-title">${year}</div>${parts.join("")}`;
              const canvas = chart.canvas;
              const parent = canvas.parentNode;
              const pad = 10;
              const cx = canvas.offsetLeft + tooltip.caretX;
              const cy = canvas.offsetTop + tooltip.caretY;
              tooltipEl.style.opacity = 1;
              tooltipEl.style.left = `${cx}px`;
              tooltipEl.style.top = `${cy}px`;
              requestAnimationFrame(() => {
                const tw = tooltipEl.offsetWidth;
                const pw = parent.clientWidth;
                if (!tw || !pw) {
                  tooltipEl.style.transform = "translate(-50%, calc(-100% - 8px))";
                  return;
                }
                let dx = -tw / 2;
                if (cx + dx < pad) dx = pad - cx;
                if (cx + dx + tw > pw - pad) dx = pw - pad - cx - tw;
                tooltipEl.style.transform = `translate(${dx}px, calc(-100% - 8px))`;
              });
            }
          }
        },
        scales: {
          y: {
            title: { display: true, text: "Доля поинтов, %", color: "rgba(55, 65, 81, 0.75)", font: { size: 11, weight: 600 } },
            ticks: { color: "rgba(55, 65, 81, 0.55)", font: { size: 9, weight: 500 }, maxTicksLimit: 5 },
            grid: { color: "rgba(15, 23, 42, 0.06)", drawBorder: false },
            border: { display: true, color: "rgba(15, 23, 42, 0.12)", width: 1 },
            beginAtZero: true,
            min: 0
          },
          x: {
            ticks: {
              color: "rgba(55, 65, 81, 0.55)",
              font: { size: 9, weight: 500 },
              maxRotation: 0,
              autoSkip: false,
              padding: 8,
              callback: function(value) {
                const label = this.getLabelForValue(value);
                return (label === "2021" || label === "2023" || label === "2026" || label === "2031" || label === "2036") ? label : "";
              }
            },
            grid: { display: false, drawBorder: true, drawTicks: false },
            border: { display: true, color: "rgba(15, 23, 42, 0.14)", width: 1 }
          }
        }
      }
    });
  </script>
</body>
</html>
