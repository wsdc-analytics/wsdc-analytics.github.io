<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Novice forecast</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --surface-card: #ffffff;
      --text: #2c2f30;
      --muted-soft: #abadae;
      --border: rgba(117, 119, 120, 0.16);
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius-outer: 30px;
      --radius-md: 12px;
      /* Факт: не резервируем интерактивные Leader/Follower цвета */
      --fact-line: #0ea5e9;
      --fact-fill: rgba(14, 165, 233, 0.12);
      --fact-fill-border: rgba(14, 165, 233, 0.22);
      --central-line: #475569;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--surface-card);
      color: var(--text);
    }
    .card { padding: 4px 2px 8px; }
    .chart-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      background: var(--surface-card);
      box-shadow: var(--shadow);
      padding: 16px 16px 14px;
      overflow: visible;
    }
    .chart-top {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 8px;
    }
    .chart-controls { width: 100%; min-width: 0; }
    .control label {
      display: block;
      font-size: 9px;
      font-weight: 800;
      color: var(--muted-soft);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin: 0 0 5px 2px;
    }
    .static-box {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
    }
    .chart-legend { width: 100%; }
    .legend {
      display: flex;
      gap: 8px;
      margin: 0;
      flex-wrap: wrap;
      justify-content: flex-start;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #5b6063;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: #f7f8f9;
      border: 1px solid rgba(117, 119, 120, 0.14);
      border-radius: 999px;
      padding: 4px 8px;
    }
    .legend-line {
      width: 10px;
      height: 2px;
      background: transparent;
      display: inline-block;
      box-sizing: border-box;
    }
    .legend-line.fact { border-top: 2px solid var(--fact-line); }
    .legend-line.central { border-top: 2px dashed var(--central-line); }
    .legend-line.band {
      height: 8px;
      width: 12px;
      border-radius: 2px;
      background: var(--fact-fill);
      border: 1px solid var(--fact-fill-border);
    }
    .chart-canvas-box {
      margin: 6px 0 0;
      padding: 10px 6px 12px;
      border-radius: 12px;
      background: #ffffff;
      overflow: visible;
      position: relative;
      width: 100%;
      height: 280px;
      min-height: 280px;
      box-sizing: border-box;
    }
    .chartjs-ext-tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(117, 119, 120, 0.24);
      border-radius: 12px;
      padding: 10px 12px;
      pointer-events: none;
      left: 0;
      top: 0;
      min-width: 168px;
      max-width: min(340px, 92vw);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      z-index: 10;
    }
    .chartjs-ext-tooltip .tt-title {
      font-size: 11px;
      font-weight: 700;
      color: #2c2f30;
      margin: 0 0 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .chartjs-ext-tooltip .tt-meta {
      font-size: 10px;
      font-weight: 500;
      color: #5b6063;
      line-height: 1.35;
      margin: 0 0 6px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(117, 119, 120, 0.12);
    }
    .chartjs-ext-tooltip .tt-meta p { margin: 0 0 4px; }
    .chartjs-ext-tooltip .tt-meta p:last-child { margin-bottom: 0; }
    .chartjs-ext-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 12px;
      line-height: 1.35;
      margin: 2px 0;
    }
    .chartjs-ext-tooltip .tt-label { color: #2c2f30; font-weight: 600; }
    .chartjs-ext-tooltip .tt-value { margin-left: auto; font-weight: 700; text-align: right; }
  </style>
</head>
<body>
  <div class="card">
    <div class="chart-wrap">
      <div class="chart-top">
        <div class="chart-controls">
          <div class="control">
            <label>Показатель</label>
            <div class="static-box">Novice Leader — доля secondary-поинтов в сумме лидерских поинтов за год, % (факт 2021–2026 и сценарный коридор).</div>
          </div>
        </div>
        <div class="chart-legend">
          <div class="legend">
            <span class="legend-item"><span class="legend-line fact"></span>Факт (2021–2026)</span>
            <span class="legend-item"><span class="legend-line central"></span>Центральный тренд</span>
            <span class="legend-item"><span class="legend-line band"></span>Коридор прогноза (3 модели)</span>
          </div>
        </div>
      </div>
      <div class="chart-canvas-box">
        <canvas id="chart"></canvas>
      </div>
    </div>
  </div>
  <script>
    const NOMINATION = "Novice Leader";
    const MEASURE_TOOLTIP = "Доля secondary-поинтов в сумме лидерских поинтов за год, %";
    const SLICE_TOOLTIP = "факт и три сценария прогноза на оси времени";

    function getOrCreateTooltip(chart) {
      let tooltipEl = chart.canvas.parentNode.querySelector(".chartjs-ext-tooltip");
      if (!tooltipEl) {
        tooltipEl = document.createElement("div");
        tooltipEl.className = "chartjs-ext-tooltip";
        chart.canvas.parentNode.style.position = "relative";
        chart.canvas.parentNode.appendChild(tooltipEl);
      }
      return tooltipEl;
    }

    const YEARS = ["2021","2022","2023","2024","2025","2026","2027","2028","2029","2030","2031","2032","2033","2034","2035","2036"];
    const FACT = [9.02,10.25,15.47,17.52,20.48,19.52,null,null,null,null,null,null,null,null,null,null];
    const CENTRAL = [null,null,null,null,null,21.46,23.9,26.34,28.77,31.21,33.64,36.08,38.51,40.95,43.38,45.82];
    const LOW = [null,null,null,null,null,19.52,20.74,21.95,23.17,24.39,25.61,26.83,28.04,29.26,30.48,31.7];
    const HIGH = [null,null,null,null,null,21.46,23.9,26.34,29.69,34.14,39.26,45.15,51.92,59.71,68.66,78.96];

    const ctx = document.getElementById("chart");
    new Chart(ctx, {
      type: "line",
      data: {
        labels: YEARS,
        datasets: [
          { label: "Факт", data: FACT, borderColor: "#0ea5e9", backgroundColor: "#0ea5e9", borderWidth: 1.8, tension: 0.35, cubicInterpolationMode: "monotone", pointRadius: 0, pointHoverRadius: 3, pointBackgroundColor: "#ffffff", pointBorderColor: "#0284c7", pointBorderWidth: 1.2 },
          { label: "Центральный тренд", data: CENTRAL, borderColor: "#475569", backgroundColor: "#475569", borderWidth: 1.5, borderDash: [5, 4], tension: 0.35, cubicInterpolationMode: "monotone", pointRadius: 0, pointHoverRadius: 3, pointBackgroundColor: "#ffffff", pointBorderColor: "#475569", pointBorderWidth: 1.2 },
          { label: "Нижняя граница", data: LOW, borderColor: "rgba(14,165,233,0)", backgroundColor: "rgba(14,165,233,0)", borderWidth: 0, pointRadius: 0, tension: 0.35, cubicInterpolationMode: "monotone" },
          { label: "Верхняя граница", data: HIGH, borderColor: "rgba(14,165,233,0)", backgroundColor: "rgba(14,165,233,0.12)", borderWidth: 0, pointRadius: 0, fill: "-1", tension: 0.35, cubicInterpolationMode: "monotone" }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8, right: 10, bottom: 22, left: 4 } },
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            external: ({ chart, tooltip }) => {
              const tooltipEl = getOrCreateTooltip(chart);
              if (tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                tooltipEl.style.transform = "";
                return;
              }
              const year = tooltip.title && tooltip.title.length ? tooltip.title[0] : "";
              const dps = tooltip.dataPoints || [];
              const byIdx = Object.fromEntries(dps.map((dp) => [dp.datasetIndex, dp]));
              const parts = [];
              if (byIdx[0]) {
                const v = byIdx[0].parsed.y;
                const t = (v == null || Number.isNaN(v)) ? "—" : `${Number(v).toFixed(1)}%`;
                parts.push(`<div class="tt-row"><span class="tt-label">Факт</span><span class="tt-value" style="color:#0ea5e9">${t}</span></div>`);
              }
              if (byIdx[1]) {
                const v = byIdx[1].parsed.y;
                const t = (v == null || Number.isNaN(v)) ? "—" : `${Number(v).toFixed(1)}%`;
                parts.push(`<div class="tt-row"><span class="tt-label">Центральный тренд</span><span class="tt-value" style="color:#475569">${t}</span></div>`);
              }
              const lo = byIdx[2]?.parsed?.y;
              const hi = byIdx[3]?.parsed?.y;
              if (lo != null && hi != null && !Number.isNaN(lo) && !Number.isNaN(hi)) {
                parts.push(`<div class="tt-row"><span class="tt-label">Коридор (3 мод.)</span><span class="tt-value" style="color:#0284c7">${Number(lo).toFixed(1)}–${Number(hi).toFixed(1)}%</span></div>`);
              }
              tooltipEl.innerHTML = `<div class="tt-title">${year}</div><div class="tt-meta"><p><strong>Номинация:</strong> ${NOMINATION}</p><p><strong>Показатель:</strong> ${MEASURE_TOOLTIP}</p><p><strong>Срез:</strong> ${SLICE_TOOLTIP}</p></div>${parts.join("")}`;
              const canvas = chart.canvas;
              const parent = canvas.parentNode;
              const pad = 10;
              const cx = canvas.offsetLeft + tooltip.caretX;
              const cy = canvas.offsetTop + tooltip.caretY;
              tooltipEl.style.opacity = 1;
              tooltipEl.style.left = `${cx}px`;
              tooltipEl.style.top = `${cy}px`;
              requestAnimationFrame(() => {
                const tw = tooltipEl.offsetWidth;
                const pw = parent.clientWidth;
                if (!tw || !pw) {
                  tooltipEl.style.transform = "translate(-50%, calc(-100% - 8px))";
                  return;
                }
                let dx = -tw / 2;
                if (cx + dx < pad) dx = pad - cx;
                if (cx + dx + tw > pw - pad) dx = pw - pad - cx - tw;
                tooltipEl.style.transform = `translate(${dx}px, calc(-100% - 8px))`;
              });
            }
          }
        },
        scales: {
          y: {
            title: { display: true, text: "Доля поинтов, %", color: "rgba(55, 65, 81, 0.75)", font: { size: 11, weight: 600 } },
            ticks: { color: "rgba(55, 65, 81, 0.55)", font: { size: 9, weight: 500 }, maxTicksLimit: 5 },
            grid: { color: "rgba(15, 23, 42, 0.06)", drawBorder: false },
            border: { display: true, color: "rgba(15, 23, 42, 0.12)", width: 1 },
            beginAtZero: true,
            min: 0
          },
          x: {
            ticks: {
              color: "rgba(55, 65, 81, 0.55)",
              font: { size: 9, weight: 500 },
              maxRotation: 0,
              autoSkip: false,
              padding: 8,
              callback: function(value) {
                const label = this.getLabelForValue(value);
                return (label === "2021" || label === "2023" || label === "2026" || label === "2031" || label === "2036") ? label : "";
              }
            },
            grid: { display: false, drawBorder: true, drawTicks: false },
            border: { display: true, color: "rgba(15, 23, 42, 0.14)", width: 1 }
          }
        }
      }
    });
  </script>
</body>
</html>
