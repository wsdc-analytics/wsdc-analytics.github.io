<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WSDC event competitors over time — stub detail page for the Event Growth Monitor." />
  <title>Event | WSDC Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/ui-primitives.css">
  <link rel="stylesheet" href="static/css/site-chrome.css">
  <link rel="stylesheet" href="static/css/dashboard-shell.css">
  <script src="static/js/analytics.js" defer></script>
  <style>
    html, body { height: 100%; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', var(--wsdc-font-sans), -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--wsdc-color-text, #1f2937);
      background: var(--wsdc-color-bg, #fff);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .page { min-height: 100%; display: flex; flex-direction: column; }
    .content {
      flex: 1; max-width: var(--wsdc-width-chrome, 1200px);
      margin: 0 auto; width: 100%; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px;
    }
    .back a { color: #2563eb; text-decoration: none; font-size: 13px; font-weight: 600; }
    .back a:hover { text-decoration: underline; }
    h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; color: #0b1221; }
    .place { color: #6b7280; font-size: 14px; }
    .notice {
      border: 1px solid #fde68a; background: #fffbeb; color: #92400e;
      border-radius: 10px; padding: 10px 12px; font-size: 13px;
    }
    .panel {
      border: 1px solid var(--wsdc-color-border, #e5e7eb); border-radius: 12px;
      padding: 14px; background: #fff;
    }
    .panel h2 { font-size: 14px; margin-bottom: 10px; }
    .spark-wrap { overflow-x: auto; }
    svg.spark { display: block; width: 100%; max-width: 720px; height: 180px; }
    table.hist { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
    table.hist th, table.hist td { padding: 7px 8px; border-bottom: 1px solid #f3f4f6; text-align: left; }
    table.hist th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #6b7280; }
    table.hist .num { text-align: right; font-variant-numeric: tabular-nums; }
    .chip {
      display: inline-flex; padding: 1px 7px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .chip-growing { background: #d1fae5; color: #065f46; }
    .chip-declining { background: #fee2e2; color: #991b1b; }
    .chip-stable { background: #f3f4f6; color: #4b5563; }
    .chip-new { background: #dbeafe; color: #1e40af; }
    .chip-restarted { background: #fef3c7; color: #92400e; }
    .approx { color: #9a3412; }
    .empty { color: #6b7280; padding: 20px 0; }
    .links a { margin-right: 14px; color: #2563eb; font-size: 13px; font-weight: 600; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="page">
    <div data-site-chrome data-active="dashboards" data-lang="en" data-home-href="index.html" data-current-dash="event_growth_dashboard_en.html"></div>
    <main class="content">
      <p class="back"><a href="event_growth_dashboard_en.html">&larr; Event Growth Monitor</a></p>
      <header>
        <h1 id="eventName">Event</h1>
        <p class="place" id="eventPlace">—</p>
      </header>
      <div class="notice">Detailed event page coming later — tiers, division mix, peaks and participants. This stub shows the competitors series used by the Growth Monitor.</div>
      <section class="panel">
        <h2>Competitors by edition</h2>
        <div class="spark-wrap" id="sparkWrap"><div class="empty">Loading…</div></div>
        <div id="histTable"></div>
      </section>
      <p class="links" id="extraLinks"></p>
    </main>
  </div>
  <script src="static/js/site-chrome.js"></script>
  <script>
(function () {
  "use strict";

  var PORTRAITS = {
    1: "events/001-arizona-4th-of-july/article_en.html",
    154: "events/002-uk-wcs-championships/article_en.html",
    218: "events/003-asia-wcs-open/article_en.html",
    167: "events/004-best-of-the-best-wcs/draft_ru.html",
    280: "events/005-saint-petersburg-wcs-nights/draft_ru.html"
  };

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtN(n) {
    if (n == null || !isFinite(n)) return "—";
    return Math.round(n).toLocaleString("en-US");
  }

  function fmtPct(p) {
    if (p == null || !isFinite(p)) return "—";
    var v = Math.round(p * 1000) / 10;
    return (v > 0 ? "+" : "") + v + "%";
  }

  function chip(status) {
    if (!status) return "";
    var label = status.charAt(0).toUpperCase() + status.slice(1);
    return '<span class="chip chip-' + esc(status) + '">' + esc(label) + "</span>";
  }

  function safeHref(href) {
    var t = String(href || "").trim();
    if (!t) return null;
    if (/^(javascript|data|vbscript):/i.test(t)) return null;
    return t;
  }

  function sparkSvg(rows) {
    if (!rows.length) return '<div class="empty">No editions</div>';
    var w = 720, h = 180, padL = 36, padR = 16, padT = 16, padB = 28;
    var vals = rows.map(function (r) { return r.competitors || 0; });
    var maxV = Math.max.apply(null, vals.concat([1]));
    var minV = 0;
    var innerW = w - padL - padR;
    var innerH = h - padT - padB;
    function x(i) {
      return padL + (rows.length === 1 ? innerW / 2 : (i * innerW) / (rows.length - 1));
    }
    function y(v) {
      return padT + innerH - ((v - minV) / (maxV - minV || 1)) * innerH;
    }
    var pts = rows.map(function (r, i) { return x(i).toFixed(1) + "," + y(r.competitors || 0).toFixed(1); }).join(" ");
    var circles = rows.map(function (r, i) {
      var cx = x(i), cy = y(r.competitors || 0);
      var fill = r.approx ? "#d97706" : "#111827";
      return '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="4" fill="' + fill + '">' +
        '<title>' + esc(r.year + "-" + String(r.month).padStart(2, "0")) + ": " +
        (r.approx ? "~" : "") + fmtN(r.competitors) + "</title></circle>";
    }).join("");
    var labels = rows.map(function (r, i) {
      return '<text x="' + x(i).toFixed(1) + '" y="' + (h - 8) +
        '" text-anchor="middle" font-size="10" fill="#6b7280">' + esc(String(r.year).slice(2)) + "</text>";
    }).join("");
    return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" role="img" aria-label="Competitors sparkline">' +
      '<polyline fill="none" stroke="#111827" stroke-width="2" points="' + pts + '" />' +
      circles + labels + "</svg>";
  }

  var params = new URLSearchParams(location.search);
  var id = Number(params.get("id"));
  if (!isFinite(id)) {
    document.getElementById("sparkWrap").innerHTML = '<div class="empty">Missing event id (?id=)</div>';
    return;
  }

  fetch("static/data/event_growth.json")
    .then(function (r) {
      if (!r.ok) throw new Error("Failed to load event_growth.json");
      return r.json();
    })
    .then(function (data) {
      var rows = (data.editions || []).filter(function (e) { return e.event_id === id; });
      rows.sort(function (a, b) { return a.year - b.year || a.month - b.month; });
      if (!rows.length) {
        document.getElementById("eventName").textContent = "Event " + id;
        document.getElementById("sparkWrap").innerHTML = '<div class="empty">No growth editions found for this event.</div>';
        return;
      }
      var last = rows[rows.length - 1];
      document.title = last.name + " | WSDC Analytics";
      document.getElementById("eventName").textContent = last.name;
      document.getElementById("eventPlace").textContent =
        [last.city, last.state, last.country, last.continent].filter(Boolean).join(" · ");
      document.getElementById("sparkWrap").innerHTML = sparkSvg(rows);

      var html = '<table class="hist"><thead><tr><th>Edition</th><th class="num">Competitors</th><th class="num">Δ</th><th>Status</th></tr></thead><tbody>';
      rows.slice().reverse().forEach(function (e) {
        var ym = e.year + "-" + String(e.month).padStart(2, "0");
        var comp = (e.approx ? '<span class="approx">~</span>' : "") + fmtN(e.competitors);
        var delta = e.delta == null ? "—" : ((e.delta > 0 ? "+" : "") + fmtN(e.delta) + " · " + fmtPct(e.pct));
        html += "<tr><td>" + esc(ym) + "</td><td class=\"num\">" + comp + "</td><td class=\"num\">" + esc(delta) +
          "</td><td>" + chip(e.status) + "</td></tr>";
      });
      html += "</tbody></table>";
      document.getElementById("histTable").innerHTML = html;

      var links = [];
      links.push('<a href="event_growth_dashboard_en.html?year=' + encodeURIComponent(last.year) +
        (last.continent ? "&continent=" + encodeURIComponent(last.continent) : "") +
        (last.country ? "&country=" + encodeURIComponent(last.country) : "") +
        '">View in Growth Monitor</a>');
      var portrait = safeHref(PORTRAITS[id]);
      if (portrait) links.push('<a href="' + esc(portrait) + '">Event portrait</a>');
      document.getElementById("extraLinks").innerHTML = links.join("");
    })
    .catch(function (err) {
      document.getElementById("sparkWrap").innerHTML =
        '<div class="empty">Could not load data: ' + esc(err.message) + "</div>";
    });
})();
  </script>
</body>
</html>
