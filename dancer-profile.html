<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dancer Profile - профиль танцора WSDC">
    <title>Dancer Profile | WSDC Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LMLCY5PE8Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LMLCY5PE8Z');
    </script>
    <style>
        :root {
            --color-primary: #2d3748;
            --bg-primary: #ffffff;
            --bg-secondary: #FFFFFF;
            --text-primary: #2d3748;
            --text-secondary: #4a5568;
            --border-color: #e5e5e5;
            --border-color-hover: #cbd5e0;
            --bg-tertiary: #f7fafc;
            --transition-base: 0.2s ease;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            overflow: hidden;
            height: 100%;
        }
        body {
            font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .header {
            flex-shrink: 0;
            padding: 12px 24px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-link {
            color: #2563eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        .back-link:hover { color: #1d4ed8; }
        .header-separator { color: var(--text-secondary); opacity: 0.6; font-size: 14px; }
        .dashboard-select {
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 32px 8px 16px;
            height: 36px;
            min-width: 200px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .dashboard-select:hover {
            border-color: var(--color-primary);
        }
        /* Dashboards dropdown — как на главной */
        .dashboards-nav { display: flex; align-items: center; }
        .dashboards-nav .dropdown-wrapper { position: relative; }
        .dashboards-nav .dropdown-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-sizing: border-box;
            min-width: 200px;
            height: 36px;
            padding: 0 16px;
            white-space: nowrap;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-base);
            font-family: inherit;
        }
        .dashboards-nav .dropdown-btn:hover {
            border-color: var(--color-primary);
            color: var(--color-primary);
        }
        .dashboards-nav .dropdown-btn:focus {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }
        .dashboards-nav .dropdown-btn svg {
            transition: transform var(--transition-base);
        }
        .dashboards-nav .dropdown-wrapper.open .dropdown-btn svg {
            transform: rotate(180deg);
        }
        .dashboards-nav .dropdown-menu {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            min-width: 240px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            padding: 6px;
            list-style: none;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-4px);
            transition: opacity var(--transition-base), transform var(--transition-base), visibility var(--transition-base);
        }
        .dashboards-nav .dropdown-wrapper.open .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .dashboards-nav .dropdown-menu a {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background var(--transition-base);
        }
        .dashboards-nav .dropdown-menu a:hover {
            background: var(--bg-tertiary);
            color: var(--color-primary);
        }
        .dashboards-nav .dropdown-menu a.current {
            font-weight: 600;
            color: var(--color-primary);
        }
        .dashboards-nav .dropdown-menu a.current::before {
            content: '✓';
            font-size: 14px;
            color: var(--color-primary);
        }
        .viz-viewport {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .viz-scaled {
            transform-origin: center center;
        }
        .viz-scaled .tableauPlaceholder {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="header">
            <a href="index.html" class="back-link">← Back to home</a>
            <span class="header-separator" aria-hidden="true">|</span>
            <nav class="dashboards-nav" aria-label="Дашборды">
                <div class="dropdown-wrapper" id="dashboardsDropdown">
                    <button type="button" class="dropdown-btn" id="dashboardsBtn" aria-expanded="false" aria-haspopup="true" aria-controls="dashboardsMenu">
                        <span id="dashboardsBtnText">Dancer Profile</span>
                        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                    </button>
                    <ul class="dropdown-menu" id="dashboardsMenu" role="menu">
                        <li role="none"><a href="dashboard.html" role="menuitem" data-dash="dashboard.html">Metrics</a></li>
                        <li role="none"><a href="navigator.html" role="menuitem" data-dash="navigator.html">Events Navigator</a></li>
                        <li role="none"><a href="rankings.html" role="menuitem" data-dash="rankings.html">Dancer's Ranking</a></li>
                        <li role="none"><a href="dancer-profile.html" role="menuitem" data-dash="dancer-profile.html">Dancer Profile</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="viz-viewport" id="vizViewport">
            <div class="viz-scaled" id="vizScaled">
                <div class='tableauPlaceholder' id='viz1770822899800' style='position: relative'>
                    <iframe
                        title='WSDC Dancer Profile'
                        src='https://public.tableau.com/views/DancerProfile/DashboardDark?:showVizHome=no'
                        style='border: 0; display: block;'
                        loading='lazy'
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <script type='text/javascript'>
        var VIZ_WIDTH = 1500;
        var VIZ_HEIGHT = 1027;

        function fitViz() {
            var viewport = document.getElementById('vizViewport');
            var scaled = document.getElementById('vizScaled');
            var availableW = viewport.clientWidth;
            var availableH = viewport.clientHeight;
            var scale = Math.min(availableW / VIZ_WIDTH, availableH / VIZ_HEIGHT);
            scale = Math.min(scale, 1);
            scaled.style.transform = 'scale(' + scale + ')';
        }

        var divElement = document.getElementById('viz1770822899800');
        var iframeElement = divElement.querySelector('iframe');
        iframeElement.style.width = VIZ_WIDTH + 'px';
        iframeElement.style.height = VIZ_HEIGHT + 'px';
        fitViz();

        window.addEventListener('resize', fitViz);

        (function() {
            var currentPage = document.location.pathname.split('/').pop() || 'dashboard.html';
            var labels = { 'dashboard.html': 'Metrics', 'navigator.html': 'Events Navigator', 'rankings.html': "Dancer's Ranking", 'dancer-profile.html': 'Dancer Profile' };
            var btn = document.getElementById('dashboardsBtn');
            var btnText = document.getElementById('dashboardsBtnText');
            var wrap = document.getElementById('dashboardsDropdown');
            if (btnText) btnText.textContent = labels[currentPage] || 'Metrics';
            document.querySelectorAll('.dashboards-nav .dropdown-menu a[data-dash]').forEach(function(a) {
                if (a.getAttribute('data-dash') === currentPage) a.classList.add('current');
            });
            if (btn && wrap) {
                btn.addEventListener('click', function(e) { e.stopPropagation(); wrap.classList.toggle('open'); btn.setAttribute('aria-expanded', wrap.classList.contains('open')); });
                document.addEventListener('click', function() { wrap.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); });
            }
        })();
    </script>
</body>
</html>
