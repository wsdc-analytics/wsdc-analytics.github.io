<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Баланс L/F в primary-переходах</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --surface-card: #ffffff;
      --text: #2c2f30;
      --muted-soft: #abadae;
      --border: rgba(117, 119, 120, 0.16);
      --shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      --radius-outer: 30px;
      --radius-md: 12px;
      --total-line: #334155;
      --div-novice: #7c3aed;
      --div-intermediate: #ea580c;
      --div-advanced: #0891b2;
      --div-allstars: #be185d;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--surface-card);
      color: var(--text);
    }
    .chart-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius-outer);
      background: var(--surface-card);
      box-shadow: var(--shadow);
      padding: 14px 14px 12px;
      overflow: visible;
    }
    .chart-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      margin-bottom: 10px;
    }
    .total-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      user-select: none;
    }
    .total-tag .swatch {
      width: 14px;
      height: 0;
      border-top: 2px dashed var(--total-line);
    }
    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      background: #fff;
      border: 1px solid rgba(117, 119, 120, 0.2);
      border-radius: 999px;
      padding: 6px 10px;
      transition: background 0.15s, border-color 0.15s;
    }
    .toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .toggle .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .toggle.on {
      background: #f1f5f9;
      border-color: rgba(51, 65, 85, 0.35);
    }
    .chart-canvas-box {
      margin: 0;
      padding: 8px 4px 10px;
      border-radius: 12px;
      background: #ffffff;
      overflow: visible;
      position: relative;
      width: 100%;
      height: 320px;
      min-height: 320px;
      box-sizing: border-box;
    }
    .chartjs-ext-tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(117, 119, 120, 0.24);
      border-radius: 12px;
      padding: 10px 12px;
      pointer-events: none;
      left: 0;
      top: 0;
      min-width: 148px;
      max-width: min(320px, 92vw);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      z-index: 10;
    }
    .chartjs-ext-tooltip .tt-title {
      font-size: 11px;
      font-weight: 700;
      color: #2c2f30;
      margin: 0 0 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .chartjs-ext-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 12px;
      line-height: 1.35;
      margin: 2px 0;
    }
    .chartjs-ext-tooltip .tt-label { font-weight: 600; }
    .chartjs-ext-tooltip .tt-value {
      margin-left: auto;
      font-weight: 700;
      text-align: right;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="chart-wrap">
    <div class="chart-toolbar">
      <span class="total-tag" title="Сводная линия по четырём дивизионам"><span class="swatch" aria-hidden="true"></span>Total</span>
      <div class="toggle-row" id="division-toggles">
        <label class="toggle on" data-key="Novice"><input type="checkbox" checked data-key="Novice" /><span class="dot" style="background:var(--div-novice)"></span>Novice</label>
        <label class="toggle" data-key="Intermediate"><input type="checkbox" data-key="Intermediate" /><span class="dot" style="background:var(--div-intermediate)"></span>Intermediate</label>
        <label class="toggle" data-key="Advanced"><input type="checkbox" data-key="Advanced" /><span class="dot" style="background:var(--div-advanced)"></span>Advanced</label>
        <label class="toggle" data-key="All-Stars"><input type="checkbox" data-key="All-Stars" /><span class="dot" style="background:var(--div-allstars)"></span>All-Stars</label>
      </div>
    </div>
    <div class="chart-canvas-box">
      <canvas id="chart"></canvas>
    </div>
  </div>
  <script>
    const YEARS = ["2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026"];
    /* Total: сумма n_primary(Leader) / сумма n_primary(Follower) по Novice, Intermediate, Advanced, All-Stars */
    const TOTAL = [84.56, 88.72, 83.93, 89.99, 88.9, 74.13, 74.42, 77.52, 77.13, 77.38, 74.22, 85.66];
    const NOVICE = [88.37, 82.77, 82.72, 87.21, 94.94, 75.23, 61.61, 70.09, 68.48, 78.13, 68.74, 79.11];
    const INTERMEDIATE = [74.48, 100.51, 86.59, 90.68, 79.67, 62.71, 97.44, 82.86, 85.24, 69.29, 78.62, 92.06];
    const ADVANCED = [89.01, 77.98, 87.39, 89.22, 84.82, 95.65, 106.67, 104.84, 93.0, 90.65, 83.9, 110.81];
    const ALL_STARS = [96.67, 138.89, 75.51, 126.47, 85.71, 80.0, 83.33, 81.82, 91.67, 85.71, 102.56, 64.29];

    const DIVISION_ORDER = ["Novice", "Intermediate", "Advanced", "All-Stars"];
    const DIVISION_DATA = {
      Novice: NOVICE,
      Intermediate: INTERMEDIATE,
      Advanced: ADVANCED,
      "All-Stars": ALL_STARS
    };
    /* Только Total — пунктир; дивизионы сплошные, чтобы не путать с Total */
    const DIVISION_STYLE = {
      Novice: { color: "#7c3aed", dash: [] },
      Intermediate: { color: "#ea580c", dash: [] },
      Advanced: { color: "#0891b2", dash: [] },
      "All-Stars": { color: "#be185d", dash: [] }
    };

    function getOrCreateTooltip(chart) {
      let tooltipEl = chart.canvas.parentNode.querySelector(".chartjs-ext-tooltip");
      if (!tooltipEl) {
        tooltipEl = document.createElement("div");
        tooltipEl.className = "chartjs-ext-tooltip";
        chart.canvas.parentNode.style.position = "relative";
        chart.canvas.parentNode.appendChild(tooltipEl);
      }
      return tooltipEl;
    }

    function isDivisionVisible(key) {
      const input = document.querySelector(`input[data-key="${key}"]`);
      return input && input.checked;
    }

    function syncToggleStyles() {
      document.querySelectorAll("#division-toggles .toggle").forEach((el) => {
        const input = el.querySelector("input");
        if (input && input.checked) el.classList.add("on");
        else el.classList.remove("on");
      });
    }

    function buildDatasets() {
      const ds = [
        {
          label: "Total",
          data: TOTAL,
          borderColor: "#334155",
          backgroundColor: "#334155",
          borderWidth: 2,
          borderDash: [6, 4],
          tension: 0.35,
          cubicInterpolationMode: "monotone",
          pointRadius: 0,
          pointHoverRadius: 3,
          pointBackgroundColor: "#ffffff",
          pointBorderColor: "#334155",
          pointBorderWidth: 1.2,
          hidden: false
        }
      ];
      DIVISION_ORDER.forEach((key) => {
        const st = DIVISION_STYLE[key];
        ds.push({
          label: key,
          data: DIVISION_DATA[key],
          borderColor: st.color,
          backgroundColor: st.color,
          borderWidth: 1.8,
          borderDash: st.dash.length ? st.dash : [],
          tension: 0.35,
          cubicInterpolationMode: "monotone",
          pointRadius: 0,
          pointHoverRadius: 3,
          pointBackgroundColor: "#ffffff",
          pointBorderColor: st.color,
          pointBorderWidth: 1.2,
          hidden: !isDivisionVisible(key)
        });
      });
      return ds;
    }

    const ctx = document.getElementById("chart");
    const chart = new Chart(ctx, {
      type: "line",
      data: {
        labels: YEARS,
        datasets: buildDatasets()
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8, right: 10, bottom: 22, left: 4 } },
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            filter: (item) => !item.dataset.hidden,
            external: ({ chart, tooltip }) => {
              const tooltipEl = getOrCreateTooltip(chart);
              if (tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                tooltipEl.style.transform = "";
                return;
              }
              const year = tooltip.title && tooltip.title.length ? tooltip.title[0] : "";
              const rows = (tooltip.dataPoints || [])
                .filter((dp) => !dp.dataset.hidden)
                .map((dp) => {
                  const v = dp.parsed.y;
                  const value = (v == null || Number.isNaN(v)) ? "—" : Number(v).toFixed(1);
                  const c = dp.dataset.borderColor;
                  return `<div class="tt-row" style="color:${c}"><span class="tt-label">${dp.dataset.label}</span><span class="tt-value">${value}</span></div>`;
                }).join("");
              tooltipEl.innerHTML = `<div class="tt-title">${year}</div>${rows}`;
              const canvas = chart.canvas;
              const parent = canvas.parentNode;
              const pad = 10;
              const cx = canvas.offsetLeft + tooltip.caretX;
              const cy = canvas.offsetTop + tooltip.caretY;
              tooltipEl.style.opacity = 1;
              tooltipEl.style.left = `${cx}px`;
              tooltipEl.style.top = `${cy}px`;
              requestAnimationFrame(() => {
                const tw = tooltipEl.offsetWidth;
                const pw = parent.clientWidth;
                if (!tw || !pw) {
                  tooltipEl.style.transform = "translate(-50%, calc(-100% - 8px))";
                  return;
                }
                let dx = -tw / 2;
                if (cx + dx < pad) dx = pad - cx;
                if (cx + dx + tw > pw - pad) dx = pw - pad - cx - tw;
                tooltipEl.style.transform = `translate(${dx}px, calc(-100% - 8px))`;
              });
            }
          }
        },
        scales: {
          y: {
            title: { display: true, text: "Лидеров на 100 фолловеров", color: "rgba(55, 65, 81, 0.75)", font: { size: 11, weight: 600 } },
            ticks: { color: "rgba(55, 65, 81, 0.55)", font: { size: 9, weight: 500 }, maxTicksLimit: 5 },
            grid: { color: "rgba(15, 23, 42, 0.06)", drawBorder: false },
            border: { display: true, color: "rgba(15, 23, 42, 0.12)", width: 1 },
            beginAtZero: true,
            min: 0
          },
          x: {
            ticks: {
              color: "rgba(55, 65, 81, 0.55)",
              font: { size: 9, weight: 500 },
              maxRotation: 0,
              autoSkip: false,
              padding: 8,
              callback: function(value) {
                const label = this.getLabelForValue(value);
                return (label === "2015" || label === "2018" || label === "2021" || label === "2023" || label === "2025" || label === "2026") ? label : "";
              }
            },
            grid: { display: false, drawBorder: true, drawTicks: false },
            border: { display: true, color: "rgba(15, 23, 42, 0.14)", width: 1 }
          }
        }
      }
    });

    document.querySelectorAll("#division-toggles input").forEach((input) => {
      input.addEventListener("change", () => {
        syncToggleStyles();
        chart.data.datasets = buildDatasets();
        chart.update();
      });
    });

    syncToggleStyles();
  </script>
</body>
</html>
