<html lang="en">
<head>

  <link rel="stylesheet" href="static/css/ui-primitives.css">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secondary-role points distribution by country</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: var(--wsdc-color-surface-soft, #f8fafc);
      --card: var(--wsdc-color-surface, #ffffff);
      --text: var(--wsdc-color-text, #1f2937);
      --muted: var(--wsdc-color-text-muted, #4b5563);
      --border: var(--wsdc-color-border, #d1d5db);
      --accent: var(--wsdc-color-brand-accent, #2563eb);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--surface-card);
      color: var(--text);
    }
    /* Slightly narrower than full viewport for embedding readability */
    .viz-shell {
      max-width: none;
      margin: 0 auto;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }
    .material-symbols-outlined {
      font-family: "Material Symbols Outlined";
      font-weight: normal;
      font-style: normal;
      font-size: 18px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
    }
    .chart-wrap {
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      padding: 10px 10px 8px;
      overflow: visible;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .head {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
      margin-bottom: 6px;
      flex: 0 0 auto;
    }
    .title {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }
    .subtitle {
      margin: 6px 0 0;
      color: #757778;
      font-size: 12px;
      line-height: 1.4;
    }
    .reference-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .reference-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: #4b5563;
      background: #f8fafc;
      border: 1px solid rgba(117, 119, 120, 0.2);
      border-radius: 999px;
      padding: 4px 9px;
      white-space: nowrap;
    }
    .controls {
      display: flex;
      flex-wrap: nowrap;
      gap: 10px;
      width: 100%;
      align-items: flex-end;
    }
    .control {
      flex: 1 1 0;
      min-width: 0;
    }
    .control.toggle-control {
      flex: 0 0 auto;
      min-width: max-content;
    }
    .control label {
      display: block;
      font-size: 9px;
      font-weight: 800;
      color: var(--muted-soft);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin: 0 0 5px 2px;
      font-family: "Inter", sans-serif;
    }
    .select-wrap {
      position: relative;
      display: block;
    }
    .select-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      font-size: 15px;
    }
    .select-icon.year { color: #4b5563; }
    .select-icon.role { color: var(--primary); }
    .select-icon.division { color: var(--secondary); }
    .select-caret {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-soft);
      pointer-events: none;
      font-size: 15px;
    }
    .filter-select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #fff;
      color: var(--text);
      padding: 8px 28px 8px 32px;
      font-family: "Inter", sans-serif;
      font-size: 12px;
      font-weight: 600;
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      cursor: pointer;
      outline: none;
    }
    .filter-select:focus {
      border-color: var(--primary);
    }
    .toggle {
      margin-top: 19px;
      font-size: 12px;
      color: #5b6063;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .chart-box {
      position: relative;
      margin: 4px 0 0;
      padding: 8px 4px 8px;
      border-radius: 12px;
      background: #ffffff;
      overflow: visible;
      width: 100%;
      flex: 1 1 auto;
      min-height: 260px;
    }
    .chartjs-ext-tooltip {
      position: absolute;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(117, 119, 120, 0.24);
      border-radius: 12px;
      padding: 10px 12px;
      pointer-events: none;
      left: 0;
      top: 0;
      min-width: 200px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      z-index: 10;
    }
    .chartjs-ext-tooltip .tt-title {
      font-size: 11px;
      font-weight: 700;
      color: #2c2f30;
      margin: 0 0 6px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .chartjs-ext-tooltip .tt-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 12px;
      line-height: 1.35;
      margin: 2px 0;
      color: #2c2f30;
    }
    .chartjs-ext-tooltip .tt-label { font-weight: 600; }
    .chartjs-ext-tooltip .tt-value {
      margin-left: auto;
      font-weight: 700;
      text-align: right;
      font-family: inherit;
      font-variant-numeric: normal;
    }
    .chartjs-ext-tooltip.is-pinned {
      pointer-events: auto;
    }
    .chartjs-ext-tooltip .tt-action-row {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(117, 119, 120, 0.18);
    }
    .chartjs-ext-tooltip .tt-action {
      border: none;
      background: transparent;
      color: #4f46e5;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .chartjs-ext-tooltip .tt-action:hover {
      color: #4338ca;
    }
    .dancer-drawer {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 320px;
      max-height: 360px;
      overflow: hidden;
      border-radius: 12px;
      border: 1px solid rgba(117, 119, 120, 0.24);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
      z-index: 11;
      display: flex;
      flex-direction: column;
    }
    .dancer-drawer[hidden] {
      display: none;
    }
    .dancer-drawer__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(117, 119, 120, 0.16);
      background: #fafafa;
    }
    .dancer-drawer__title {
      margin: 0;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #2c2f30;
    }
    .dancer-drawer__close {
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      padding: 0 2px;
    }
    .dancer-drawer__body {
      overflow: auto;
      padding: 8px 10px 10px;
      font-size: 12px;
      color: #2c2f30;
    }
    .dancer-table {
      width: 100%;
      border-collapse: collapse;
    }
    .dancer-table th {
      text-align: left;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b7280;
      padding: 0 0 6px;
      border-bottom: 1px solid rgba(117, 119, 120, 0.14);
    }
    .dancer-table td {
      padding: 6px 0;
      border-bottom: 1px solid rgba(117, 119, 120, 0.1);
      vertical-align: top;
    }
    .dancer-table td:last-child,
    .dancer-table th:last-child {
      text-align: right;
      padding-left: 8px;
      white-space: nowrap;
    }
    .drawer-muted {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.4;
      margin: 0;
    }
    @media (max-width: 700px) {
      .chart-wrap {
        padding: 8px 8px 6px;
      }
      .controls {
        flex-wrap: wrap;
      }
      .control {
        flex: 1 1 calc(50% - 10px);
      }
      .control.toggle-control {
        flex: 1 1 100%;
      }
      .toggle {
        margin-top: 4px;
      }
      .chart-box {
        min-height: 220px;
      }
      .dancer-drawer {
        width: calc(100% - 20px);
        max-height: 250px;
        top: auto;
        right: 10px;
        left: 10px;
        bottom: 10px;
      }
    }
  </style>
</head>

    function buildAdaptiveRadiusMap(rows) {
      // Bubble size should match dancers shown in drawer for current slice:
      // only dancers who contributed secondary-role points.
      const counts = rows.map((r) => Math.max(0, Number(r.transitions) || 0));
      const positives = counts.filter((v) => v > 0);
      if (!positives.length) {
        return rows.map(() => 0);
      }

      const minPositive = Math.min(...positives);
      const maxCount = Math.max(...positives);

      // Keep 1-2 dancers visually small (not dominant), but still clickable.
      // Scale by current slice to preserve differentiation across filters.
      let minR = 5.5;
      let maxR = 30;
      if (maxCount <= 3) {
        minR = 6;
        maxR = 20;
      } else if (maxCount <= 8) {
        minR = 6;
        maxR = 23;
      } else if (maxCount <= 25) {
        minR = 5.5;
        maxR = 26;
      }

      return rows.map((r) => {
        const c = Math.max(0, Number(r.transitions) || 0);
        if (c <= 0) return 0;
        if (maxCount === minPositive) {
          return minR;
        }
        // Perception-friendly area scaling + slight easing for mid-range spread.
        const tRaw = (Math.sqrt(c) - Math.sqrt(minPositive)) / (Math.sqrt(maxCount) - Math.sqrt(minPositive));
        const t = Math.pow(Math.min(1, Math.max(0, tRaw)), 0.9);
        return minR + t * (maxR - minR);
      });
    }

        const xPx = xScale.getPixelForValue(meanX);
        const yPx = yScale.getPixelForValue(meanY);
        if (!Number.isFinite(xPx) || !Number.isFinite(yPx)) return;

        const ctx = chart.ctx;
        ctx.save();
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 1.1;
        ctx.strokeStyle = "rgba(107, 114, 128, 0.65)";

        ctx.beginPath();
        ctx.moveTo(xPx, area.top);
        ctx.lineTo(xPx, area.bottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(area.left, yPx);
        ctx.lineTo(area.right, yPx);
        ctx.stroke();

        ctx.restore();
      }
    };

    const flagBubblePlugin = {
      id: "flagBubblePlugin",
      afterDatasetsDraw(chart) {
        const meta = chart.getDatasetMeta(0);
        const points = chart.data.datasets[0].data || [];
        const ctx = chart.ctx;
        ctx.save();
        meta.data.forEach((el, i) => {
          const d = points[i];
          if (!d) return;
          const x = el.x;
          const y = el.y;
          const r = Math.max(3, d.r || 8);
          const code = d.code || "";
          const img = getFlagImage(code, () => chart.update("none"));

          // circular clip area for flag-filled bubble
          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.closePath();
          ctx.clip();

          if (img && img.complete && img.naturalWidth > 0) {
            const side = r * 2;
            const sw = img.naturalWidth;
            const sh = img.naturalHeight;
            const srcSize = Math.min(sw, sh);
            const sx = (sw - srcSize) / 2;
            const sy = (sh - srcSize) / 2;
            ctx.globalAlpha = 0.8;
            ctx.drawImage(img, sx, sy, srcSize, srcSize, x - r, y - r, side, side);
            ctx.globalAlpha = 1;
          } else {
            ctx.fillStyle = "rgba(37,99,235,0.35)";
            ctx.fill();
          }
          ctx.restore();

          // thin gray border around each flag bubble
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(107, 114, 128, 0.85)";
          ctx.lineWidth = 0.8;
          ctx.stroke();

        });
        ctx.restore();
      }
    };

    const chart = new Chart(ctx, {
      type: "bubble",
      plugins: [referenceMeanLinesPlugin, flagBubblePlugin],
      data: {
        datasets: [{
          label: "Countries",
          data: getPoints(activeYear, activeGroup, activeDivision, false),
          borderColor: "rgba(55,65,81,0.45)",
          backgroundColor: "rgba(59,130,246,0.18)",
          borderWidth: 0.8
        }]
      },
      options: {
        maintainAspectRatio: false,
        interaction: { mode: "nearest", intersect: true },
        onClick: (evt, elements, chartInstance) => {
          const hits = chartInstance.getElementsAtEventForMode(
            evt,
            "nearest",
            { intersect: true },
            true
          );
          if (!hits.length) {
            clearPin(chartInstance);
            closeDancerDrawer();
            return;
          }
          const hit = hits[0];
          const ds = chartInstance.data.datasets[hit.datasetIndex];
          const point = ds && ds.data ? ds.data[hit.index] : null;
          const el = chartInstance.getDatasetMeta(hit.datasetIndex).data[hit.index];
          if (!point || !el) return;
          pinState.active = true;
          pinState.point = point;
          pinState.x = el.x;
          pinState.y = el.y;
          const tooltipEl = getOrCreateTooltip(chartInstance);
          renderPinnedTooltip(chartInstance, tooltipEl);
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: false,
            external: ({ chart, tooltip }) => {
              const tooltipEl = getOrCreateTooltip(chart);
              if (pinState.active && pinState.point) {
                renderPinnedTooltip(chart, tooltipEl);
                return;
              }
              tooltipEl.classList.remove("is-pinned");
              if (tooltip.opacity === 0) {
                tooltipEl.style.opacity = 0;
                tooltipEl.style.transform = "";
                return;
              }
              const dp = tooltip.dataPoints && tooltip.dataPoints[0];
              if (!dp || !dp.raw) {
                tooltipEl.style.opacity = 0;
                return;
              }
              const d = dp.raw;
              const title = d.country || "—";
              tooltipEl.innerHTML = `<div class="tt-title">${title}</div>${formatTooltipRows(d)}`;
              const canvas = chart.canvas;
              const parent = canvas.parentNode;
              const pad = 10;
              const cx = canvas.offsetLeft + tooltip.caretX;
              const cy = canvas.offsetTop + tooltip.caretY;
              tooltipEl.style.opacity = 1;
              tooltipEl.style.left = `${cx}px`;
              tooltipEl.style.top = `${cy}px`;
              requestAnimationFrame(() => {
                const tw = tooltipEl.offsetWidth;
                const pw = parent.clientWidth;
                if (!tw || !pw) {
                  tooltipEl.style.transform = "translate(-50%, calc(-100% - 8px))";
                  return;
                }
                let dx = -tw / 2;
                if (cx + dx < pad) dx = pad - cx;
                if (cx + dx + tw > pw - pad) dx = pw - pad - cx - tw;
                tooltipEl.style.transform = `translate(${dx}px, calc(-100% - 8px))`;
              });
            }
          }
        },
        scales: {
          x: {
            title: { display: true, text: "Share of points, %" },
            min: 0,
            ticks: {
              stepSize: 5,
              callback: function(value) {
                const n = Number(this.getLabelForValue(value));
                return Number.isFinite(n) ? Math.round(n) : "";
              }
            },
            grid: { display: false, drawBorder: true, drawTicks: false }
          },
          y: {
            beginAtZero: true,
            title: { display: true, text: "Points" },
            ticks: {
              callback: function(value) {
                const n = Number(this.getLabelForValue(value));
                if (!Number.isFinite(n)) return "";
                if (Math.abs(n) < 1e-9) return "";
                return Math.round(n);
              }
            },
            grid: { display: false, drawBorder: true, drawTicks: false }
          }
        }
      }
    });

    function applyResponsiveChartTypography() {
      const tiny = window.matchMedia("(max-width: 480px)").matches;
      const mobile = isMobileViewport();
      const tickSize = mobile ? (tiny ? 9 : 10) : 12;
      const titleSize = mobile ? (tiny ? 10 : 11) : 13;
      chart.options.scales.x.ticks.font = { size: tickSize };
      chart.options.scales.y.ticks.font = { size: tickSize };
      chart.options.scales.x.title.font = { size: titleSize, weight: "600" };
      chart.options.scales.y.title.font = { size: titleSize, weight: "600" };
    }

    function updateChart() {
      applyResponsiveChartTypography();
      const points = getPoints(activeYear, activeGroup, activeDivision, hideUsaEl.checked);
      applyDynamicAxisPadding(points);
      setSummaryPills(points);
      chart.data.datasets[0].data = points;
      clearPin(chart);
      closeDancerDrawer();
      chart.update();
    }

    window.addEventListener("resize", updateChart);

    yearSelEl.addEventListener("change", function () {
      activeYear = this.value;
      updateChart();
    });
    hideUsaEl.addEventListener("change", updateChart);
    groupSelEl.addEventListener("change", function () {
      activeGroup = this.value;
      updateChart();
    });
    divisionSelEl.addEventListener("change", function () {
      activeDivision = this.value;
      updateChart();
    });
    drawerCloseEl.addEventListener("click", () => {
      closeDancerDrawer();
    });

    ensureUnifiedData()
      .then(() => updateChart())
      .catch(() => {
        // keep legacy embedded DATA as fallback
      });
  </script>
  <script src="static/js/wsdc-select.js"></script>
</body>
</html>
