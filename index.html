    <style>
        :root {
            /* Основные цвета */
            --color-primary: #2d3748;
            --color-primary-dark: #0B1221;

            --color-accent: #2563eb;
            
            /* Фоны */

            --bg-secondary: #FFFFFF;
            --bg-tertiary: #f7fafc;
            
            /* Текст */

            /* Границы */
            --border-color: #e5e7eb;

            /* Переходы */
            --transition-fast: 0.15s ease;
            --transition-base: 0.2s ease;
            --transition-slow: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            pointer-events: none;

            opacity: 1;
            pointer-events: auto;
        }

                font-size: 18px;
            }

            .articles-grid { gap: 0; }
        }

        /* Evolved C homepage additions */
        .container.wsdc-chrome-page-pad {
            padding-top: calc(env(safe-area-inset-top, 0px) + 96px);
        }
        header {
            margin-top: 108px;
            margin-bottom: 48px;
            text-align: center;
        }
        .kpi-banner {
            position: fixed;
            top: 0;
            right: 0;
            z-index: 40;
            width: max-content;
            max-width: min(420px, calc(100vw - 32px));
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 0;
            background: transparent;
            text-align: left;
            visibility: hidden;
            opacity: 0;
            transition: opacity 140ms ease;
        }
        .kpi-banner.is-ready {
            visibility: visible;
            opacity: 1;
        }
        .kpi-scales {
            display: none;
            grid-template-columns: 18px 72px 72px 72px 28px;
            column-gap: 12px;
            align-items: center;
            margin: 0 0 4px;
            width: max-content;
        }
        .kpi-banner.is-open .kpi-scales {
            display: grid;
        }
        .kpi-scales-inner {
            grid-column: 2 / 5;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2px;
        }
        .kpi-scale {
            appearance: none;
            border: 1px solid transparent;
            background: transparent;
            border-radius: 999px;
            padding: 3px 8px;
            font: inherit;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), background 160ms ease, border-color 160ms ease;
        }
        .kpi-scale:hover { background: var(--bg-tertiary); color: var(--text-primary); }
        .kpi-scale:active { transform: scale(0.97); }
        .kpi-scale.is-active {
            border-color: var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        .kpi-period {
            display: none;
            grid-template-columns: 18px 72px 72px 72px 28px;
            column-gap: 12px;
            align-items: center;
            margin: 0 0 6px;
            width: max-content;
            font-size: 10px;
            color: var(--text-tertiary);
            line-height: 1.2;
        }
        .kpi-banner.is-open .kpi-period {
            display: grid;
        }
        .kpi-period-inner {
            grid-column: 2 / 5;
            text-align: center;
        }
        .kpi-labels {
            display: grid;
            grid-template-columns: 18px 72px 72px 72px;
            column-gap: 12px;
            margin-bottom: 2px;
            padding-right: 40px;
            align-items: end;
        }
        .kpi-labels span {
            font-size: 10px;
            line-height: 1.2;
            color: var(--text-tertiary);
            text-transform: lowercase;
            letter-spacing: 0.02em;
            text-align: center;
        }
        .kpi-labels .kpi-tip-slot {
            width: 18px;
        }
        .kpi-values {
            display: grid;
            grid-template-columns: 18px 72px 72px 72px 28px;
            column-gap: 12px;
            align-items: center;
        }
        .kpi-values .value {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            text-align: center;
        }
        .kpi-tip {
            position: relative;
            appearance: none;
            border: 1.5px solid var(--border-color);
            background: var(--bg-primary, #fff);
            width: 18px;
            height: 18px;
            padding: 0;
            border-radius: 999px;
            color: var(--text-tertiary);
            font-size: 10px;
            font-weight: 600;
            line-height: 1;
            cursor: help;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            justify-self: center;
            box-sizing: border-box;
        }
        .kpi-tip:focus { outline: none; }
        .kpi-tip:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
            border-color: var(--color-primary);
            color: var(--text-primary);
        }
        .kpi-tip-bubble {
            position: absolute;
            left: calc(100% + 8px);
            right: auto;
            top: 50%;
            transform: translateY(-50%) scale(0.96);
            transform-origin: left center;
            min-height: 32px;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: var(--color-primary);
            color: #fff;
            font-size: 12px;
            font-weight: 400;
            line-height: 1.35;
            border-radius: 8px;
            width: max-content;
            max-width: min(260px, calc(100vw - 48px));
            white-space: normal;
            text-align: left;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            z-index: 8;
            transition:
                opacity 120ms cubic-bezier(0.23, 1, 0.32, 1),
                transform 120ms cubic-bezier(0.23, 1, 0.32, 1),
                visibility 120ms cubic-bezier(0.23, 1, 0.32, 1);
        }
        .kpi-tip:focus-visible .kpi-tip-bubble {
            opacity: 1;
            visibility: visible;
            transform: translateY(-50%) scale(1);
            transition-duration: 180ms;
        }
        @media (hover: hover) and (pointer: fine) {
            .kpi-tip:hover {
                border-color: var(--text-primary);
                color: var(--text-primary);
            }
            .kpi-tip:hover .kpi-tip-bubble {
                opacity: 1;
                visibility: visible;
                transform: translateY(-50%) scale(1);
                transition-duration: 180ms;
            }
        }
        .kpi-toggle {
            appearance: none;
            border: none;
            background: transparent;
            width: 28px;
            height: 28px;
            margin: 0;
            padding: 0;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-tertiary);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            justify-self: center;
            transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), color 140ms ease;
        }
        .kpi-toggle:hover { color: var(--text-primary); }
        .kpi-toggle:active { transform: scale(0.97); }
        .kpi-incs {
            display: none;
            grid-template-columns: 18px 72px 72px 72px;
            column-gap: 12px;
            margin-top: 2px;
            padding-right: 40px;
        }
        .kpi-banner.is-open .kpi-incs {
            display: grid;
        }
        .kpi-incs .inc {
            font-size: 10px;
            color: var(--text-tertiary);
            font-variant-numeric: tabular-nums;
            line-height: 1.2;
            text-align: center;
        }
        .kpi-incs .kpi-tip-slot { width: 18px; }
        .articles-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-top: 8px;
        }
        .article-card {
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            padding: 28px 0;
            box-shadow: none;
            transition: opacity 160ms ease;
            text-decoration: none;
            color: inherit;
            display: block;
            position: relative;
        }
        .article-card:hover { opacity: 0.88; }
        .article-card:focus-visible {
            outline: 2px solid var(--color-primary);

        .article-card.is-featured {
            padding-top: 8px;
            padding-bottom: 36px;

            border-bottom-width: 1px;
        }
        .article-card .meta {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 0;
            text-transform: none;
            letter-spacing: 0;
        }
        .article-card.is-featured .meta {
            color: var(--text-secondary);
        }
        .article-card h2 {
            font-size: 20px;
            font-weight: 600;
            margin: 6px 0 8px;
            letter-spacing: -0.01em;
            line-height: 1.25;
            color: var(--text-primary);
        }
        .article-card.is-featured h2 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .article-card p {
            margin: 0;
            max-width: 65ch;
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.55;
        }
        @media (max-width: 768px) {
            .container.wsdc-chrome-page-pad {
                padding-top: calc(env(safe-area-inset-top, 0px) + 110px);
            }
            header { margin-top: 64px; }
            .kpi-banner {
                display: none;
            }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-link">Перейти к содержимому</a>

    <div
        data-site-chrome
        data-active="home"
        data-lang="en"
        data-fixed="true"
        data-brand="logo"
        data-home-href="index.html"
    ></div>

    <div class="container wsdc-chrome-page-pad">
        <header>
            <h1>WSDC Analytics</h1>
            <p class="subtitle" id="subtitle">West Coast Swing: Statistics, Research & Analytics</p>
        </header>

        <section class="kpi-banner" id="kpiBanner" aria-label="Community totals">
            <div class="kpi-scales" role="tablist" aria-label="Increment window" aria-hidden="true">
                <div class="kpi-scales-inner">
                    <button type="button" class="kpi-scale is-active" data-kpi-scale="week">Week</button>
                    <button type="button" class="kpi-scale" data-kpi-scale="month">Month</button>
                    <button type="button" class="kpi-scale" data-kpi-scale="year">Year</button>
                </div>
            </div>
            <div class="kpi-period" id="kpiPeriod" aria-hidden="true">
                <span class="kpi-period-inner" id="kpiPeriodText"></span>
            </div>
            <div class="kpi-labels">
                <span class="kpi-tip-slot" aria-hidden="true"></span>
                <span>events</span>
                <span>points</span>
                <span>dancers</span>
            </div>
            <div class="kpi-values" id="kpiValues">
                <button type="button" class="kpi-tip" id="kpiTip" aria-label="About these totals">
                    i
                    <span class="kpi-tip-bubble" id="kpiTipText" role="tooltip">
                        A counter of core WSDC metrics: number of events, points awarded, and dancers who earned at least one point at WSDC events. In the details, metric growth for the latest week, current month, or year.
                    </span>
                </button>
                <span class="value" data-kpi="events">-</span>
                <span class="value" data-kpi="points">-</span>
                <span class="value" data-kpi="dancers">-</span>
                <button type="button" class="kpi-toggle" id="kpiToggle" aria-expanded="false" aria-controls="kpiBanner" aria-label="Expand totals details">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" data-kpi-chevron>
                        <path d="M2.5 4.5L6 8L9.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <div class="kpi-incs" id="kpiIncs" aria-hidden="true">
                <span class="kpi-tip-slot" aria-hidden="true"></span>
                <span class="inc" data-kpi-inc="events">-</span>
                <span class="inc" data-kpi-inc="points">-</span>
                <span class="inc" data-kpi-inc="dancers">-</span>
            </div>
        </section>

        <main id="main-content">
            <div class="articles-grid" id="articlesGrid" role="list">
                <!-- Статьи загружаются динамически через JavaScript -->
            </div>
        </main>
    </div>

    <script src="static/js/site-chrome.js" defer></script>
    <script>
        // Данные статей (загружаются из JSON)
        let articlesByLang = {};

        // Загрузка статей
        fetch('static/data/articles.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                articlesByLang = data;
                // Обновление интерфейса после загрузки данных
                const currentLang = getCurrentLanguage();
                updateLanguage(currentLang);
            })
            .catch(error => {
                console.error('Error loading articles:', error);
                const errorMessages = {
                    ru: 'Ошибка загрузки статей. Пожалуйста, попробуйте позже или откройте страницу через веб-сервер.',
                    en: 'Error loading articles. Please try again later or open the page through a web server.',
                    es: 'Error al cargar artículos. Por favor, intente más tarde o abra la página a través de un servidor web.'
                };
                const currentLang = getCurrentLanguage();
                const errorText = errorMessages[currentLang] || errorMessages.en;
                document.getElementById('articlesGrid').innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--text-secondary);">${errorText}</div>`;
            });

        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('searchResults');
        const articlesGrid = document.getElementById('articlesGrid');
        const langButtons = document.querySelectorAll('.lang-btn'); // includes chrome pills after mount

        // Определение языка: localStorage > браузер > EN по умолчанию
        function getCurrentLanguage() {
            const storedLang = localStorage.getItem('wsdc-lang');
            if (storedLang && ['ru', 'en', 'es'].includes(storedLang)) {
                return storedLang;
            }
            
            const browserLangs = Array.isArray(navigator.languages) && navigator.languages.length
                ? navigator.languages
                : [navigator.language || navigator.userLanguage || 'en'];
            for (const langRaw of browserLangs) {
                const lang = (langRaw || '').toLowerCase();
                if (lang.startsWith('ru')) return 'ru';
                if (lang.startsWith('es')) return 'es';
                if (lang.startsWith('en')) return 'en';
            }
            
            return 'en'; // По умолчанию
        }

        // Сохранение выбора языка
        function setLanguage(lang) {
            localStorage.setItem('wsdc-lang', lang);
            updateLanguage(lang);
        }

        // Обновление интерфейса при смене языка
        function updateLanguage(lang) {
            // Обновление активной кнопки
            langButtons.forEach(btn => {
                if (btn.dataset.lang === lang) {
                    btn.classList.add('active');
                    btn.setAttribute('aria-pressed', 'true');
                } else {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                }
            });

            // Обновление placeholder поиска
            const placeholders = {
                ru: 'Поиск статей...',
                en: 'Search articles...',
                es: 'Buscar artículos...'
            };
            if (searchInput) {
                searchInput.placeholder = placeholders[lang] || placeholders.en;
            }

            // Обновление подзаголовка
            const subtitles = {
                ru: 'Статистика, исследования и аналитика West Coast Swing',
                en: 'West Coast Swing: Statistics, Research & Analytics',
                es: 'West Coast Swing: Estadísticas, Investigación y Análisis'
            };
            const subtitleElement = document.getElementById('subtitle');
            if (subtitleElement) {
                subtitleElement.textContent = subtitles[lang] || subtitles.en;
            }

            const kpiTipText = document.getElementById('kpiTipText');
            const kpiTipBtn = document.getElementById('kpiTip');
            const kpiTips = {
                ru: {
                    label: 'О этих итогах',
                    text: 'Счетчик основных метрик WSDC: число прошедших изданий (ивент × год/месяц с начисленными поинтами), сумма поинтов и танцоры с хотя бы одним поинтом. В деталях — рост за неделю, месяц или год.'
                },
                en: {
                    label: 'About these totals',
                    text: 'Core WSDC metrics: number of occurred event editions (event × year/month that awarded points), points awarded, and dancers who earned at least one point. Details show growth for the latest week, current month, or year.'
                },
                es: {
                    label: 'Sobre estos totales',
                    text: 'Métricas principales de WSDC: número de ediciones celebradas (evento × año/mes con puntos), puntos otorgados y bailarines con al menos un punto. En el detalle, el crecimiento de la última semana, mes o año.'
                }
            };
            const kpiTipCopy = kpiTips[lang] || kpiTips.en;
            if (kpiTipText) kpiTipText.textContent = kpiTipCopy.text;
            if (kpiTipBtn) kpiTipBtn.setAttribute('aria-label', kpiTipCopy.label);

            const contactBtn = document.getElementById('contactBtn');
            const contactTooltipText = document.getElementById('contactTooltipText');
            const contactEmailItem = document.getElementById('contactEmailItem');
            const contactFacebookItem = document.getElementById('contactFacebookItem');
            const contactLabels = {
                ru: {
                    button: 'Контакты',
                    email: 'Написать на email',
                    facebook: 'Написать в Facebook'
                },
                en: {
                    button: 'Contact',
                    email: 'Send email',
                    facebook: 'Message on Facebook'
                },
                es: {
                    button: 'Contacto',
                    email: 'Enviar email',
                    facebook: 'Escribir en Facebook'
                }
            };
            const contactLang = contactLabels[lang] || contactLabels.en;
            if (contactBtn) contactBtn.setAttribute('aria-label', contactLang.button);
            if (contactTooltipText) contactTooltipText.textContent = contactLang.button;
            if (contactEmailItem) contactEmailItem.textContent = contactLang.email;
            if (contactFacebookItem) contactFacebookItem.textContent = contactLang.facebook;

            // Кнопка Dashboards и tooltip
            const logoLink = document.getElementById('logoLink');
            if (logoLink) {
                const logoTitles = { ru: 'Основной источник данных', en: 'Main data source', es: 'Fuente principal de datos' };
                logoLink.title = logoTitles[lang] || logoTitles.en;
            }
            const dashboardsBtnText = document.getElementById('dashboardsBtnText');
            if (dashboardsBtnText) {
                const btnLabels = { ru: 'Дашборды', en: 'Dashboards', es: 'Paneles' };
                dashboardsBtnText.textContent = btnLabels[lang] || btnLabels.en;
            }
            const dashboardsTooltip = document.getElementById('dashboardsTooltip');
            if (dashboardsTooltip) {
                const tooltips = {
                    ru: 'Информационные дашборды WSDC',
                    en: 'WSDC informational dashboards',
                    es: 'Paneles informativos WSDC'
                };
                dashboardsTooltip.textContent = tooltips[lang] || tooltips.en;
            }
            const ptsHref = 'points-summary.html';
            document.querySelectorAll('#pointsSummaryBtn, #pointsSummaryBtnMobile').forEach(el => {
                if (el) el.href = ptsHref;
            });
            const ptsTooltips = {
                ru: 'Очки, начисленные по ивентам',
                en: 'Points awarded by event',
                es: 'Puntos otorgados por evento'
            };
            const ptsTooltipText = ptsTooltips[lang] || ptsTooltips.en;
            document.querySelectorAll('#pointsSummaryTooltip, #pointsSummaryTooltipMobile').forEach(el => {
                if (el) el.textContent = ptsTooltipText;
            });
            document.querySelectorAll('[data-dash-href]').forEach(a => {
                const base = a.dataset.dashHref || a.getAttribute('href');
                a.href = base.includes('?') ? base.replace(/\?.*/, '') : base;
            });

            // Фильтрация и отображение статей
            const articles = articlesByLang[lang] || [];
            displayArticles(articles, lang);
        }

        // Форматирование даты по языку
        function formatDate(dateString, lang) {
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return '';
            
            const day = date.getDate();
            const monthNames = {
                ru: ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 
                     'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'],
                en: ['January', 'February', 'March', 'April', 'May', 'June',
                     'July', 'August', 'September', 'October', 'November', 'December'],
                es: ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
                     'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre']
            };
            
            const month = monthNames[lang] ? monthNames[lang][date.getMonth()] : monthNames.en[date.getMonth()];
            const year = date.getFullYear();
            
            // Форматы: RU: "2 января 2025", EN: "January 2, 2025", ES: "2 de enero de 2025"
            if (lang === 'ru') {
                return `${day} ${month} ${year}`;
            } else if (lang === 'es') {
                return `${day} de ${month} de ${year}`;
            } else {
                return `${month} ${day}, ${year}`;
            }
        }

        // Отображение статей
        function displayArticles(articles, lang) {
            if (articles.length === 0) {
                const noArticlesText = {
                    ru: 'Статьи на этом языке пока недоступны.',
                    en: 'Articles in this language are not available yet.',
                    es: 'Los artículos en este idioma aún no están disponibles.'
                };
                articlesGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #666;">${noArticlesText[lang] || noArticlesText.en}</div>`;
                return;
            }

            // Сортировка статей от новых к старым (по дате публикации)
            const sortedArticles = [...articles].sort((a, b) => {
                const dateA = a.datePublished ? new Date(a.datePublished) : new Date(0);
                const dateB = b.datePublished ? new Date(b.datePublished) : new Date(0);
                return dateB - dateA; // Более новые статьи первыми
            });

            let html = '';
            sortedArticles.forEach((article, index) => {
                const formattedDate = article.datePublished ? formatDate(article.datePublished, lang) : '';
                const metaText = formattedDate && article.category 
                    ? `${formattedDate} · ${article.category}`
                    : (article.category || '');
                const featured = index === 0;
                const latestLabel = { ru: 'Последнее', en: 'Latest', es: 'Lo último' };
                const metaLine = featured
                    ? `${latestLabel[lang] || latestLabel.en} · ${metaText}`
                    : metaText;
                html += `
                    <a href="${article.url}" class="article-card${featured ? ' is-featured' : ''}" role="listitem" aria-label="${article.title}">
                        <div class="meta">${metaLine}</div>
                        <h2>${article.title}</h2>
                        <p>${article.description}</p>
                    </a>
                `;
            });
            articlesGrid.innerHTML = html;
        }

        // Инициализация языка при загрузке
        const currentLang = getCurrentLanguage();
        updateLanguage(currentLang);

        function wireChromeLang() {
            if (window.WsdcChrome) {
                window.WsdcChrome.onLangChange = function(lang) { setLanguage(lang); };
                window.WsdcChrome.applyLangLabels(currentLang);
            }
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', wireChromeLang);
        } else {
            // site-chrome.js is defer — wait a tick
            setTimeout(wireChromeLang, 0);
            document.addEventListener('DOMContentLoaded', wireChromeLang);
        }

        // Homepage KPI strip
        (function initKpis() {
            const banner = document.getElementById('kpiBanner');
            if (!banner) return;
            let kpiData = null;
            let scale = 'week';
            const fmt = (n) => Math.round(Number(n) || 0).toLocaleString('en-US');
            const fmtInc = (n) => '+' + fmt(n);
            const fmtDate = (iso) => {
                const d = new Date(iso + 'T00:00:00');
                return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            };
            function render() {
                if (!kpiData) return;
                const cmp = kpiData.comparisons[scale];
                const totals = kpiData.totals;
                banner.querySelectorAll('.kpi-values [data-kpi]').forEach((el) => {
                    const key = el.getAttribute('data-kpi');
                    el.textContent = fmt(totals[key]);
                });
                banner.querySelectorAll('[data-kpi-inc]').forEach((el) => {
                    const key = el.getAttribute('data-kpi-inc');
                    el.textContent = fmtInc(cmp.increment[key]);
                });
                const period = document.getElementById('kpiPeriodText') || document.getElementById('kpiPeriod');
                if (period && cmp.period) {
                    period.textContent = fmtDate(cmp.period.start) + ' – ' + fmtDate(cmp.period.end);
                }
                requestAnimationFrame(positionBanner);
            }
            function positionBanner() {
                const valuesRow = document.getElementById('kpiValues');
                const chrome = document.querySelector('.wsdc-chrome-wrap.is-fixed .wsdc-chrome') || document.querySelector('.wsdc-chrome');
                const chromeRect = chrome
                    ? chrome.getBoundingClientRect()
                    : { left: 16, right: window.innerWidth - 16, bottom: 58 };
                banner.style.left = '0px';
                banner.style.right = 'auto';
                banner.style.top = '0px';
                banner.classList.add('is-ready');
                const bannerRect = banner.getBoundingClientRect();
                const valuesRect = valuesRow ? valuesRow.getBoundingClientRect() : bannerRect;
                const valuesOffset = valuesRect.top - bannerRect.top;
                const minLeft = 12;
                const maxRight = window.innerWidth - 12;
                const chromeRight = Math.min(chromeRect.right, maxRight);
                const left = Math.max(minLeft, chromeRight - bannerRect.width);
                const parkValuesTop = chromeRect.bottom + 81;
                const top = parkValuesTop - valuesOffset;
                banner.style.left = Math.round(left) + 'px';
                banner.style.top = Math.round(Math.max(8, top)) + 'px';
            }
            banner.querySelectorAll('[data-kpi-scale]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    scale = btn.getAttribute('data-kpi-scale');
                    banner.querySelectorAll('[data-kpi-scale]').forEach((b) => b.classList.toggle('is-active', b === btn));
                    render();
                });
            });
            const toggleBtn = document.getElementById('kpiToggle');
            const expandLabels = {
                ru: { open: 'Свернуть детали', closed: 'Развернуть детали' },
                en: { open: 'Collapse totals details', closed: 'Expand totals details' },
                es: { open: 'Cerrar detalles', closed: 'Abrir detalles' }
            };
            const CHEVRON_DOWN = 'M2.5 4.5L6 8L9.5 4.5';
            const CHEVRON_UP = 'M2.5 7.5L6 4L9.5 7.5';
            function setKpiOpen(open) {
                banner.classList.toggle('is-open', open);
                const scales = banner.querySelector('.kpi-scales');
                const period = document.getElementById('kpiPeriod');
                const incs = document.getElementById('kpiIncs');
                if (scales) scales.setAttribute('aria-hidden', open ? 'false' : 'true');
                if (period) period.setAttribute('aria-hidden', open ? 'false' : 'true');
                if (incs) incs.setAttribute('aria-hidden', open ? 'false' : 'true');
                if (!toggleBtn) return;
                toggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                const lang = getCurrentLanguage();
                const labels = expandLabels[lang] || expandLabels.en;
                toggleBtn.setAttribute('aria-label', open ? labels.open : labels.closed);
                const path = toggleBtn.querySelector('[data-kpi-chevron] path');
                if (path) path.setAttribute('d', open ? CHEVRON_UP : CHEVRON_DOWN);
                requestAnimationFrame(positionBanner);
            }
            if (toggleBtn) {
                toggleBtn.addEventListener('click', () => {
                    setKpiOpen(!banner.classList.contains('is-open'));
                });
            }
            window.addEventListener('resize', positionBanner);
            window.addEventListener('load', positionBanner);
            fetch('static/data/homepage_kpis.json')
                .then((r) => r.json())
                .then((data) => { kpiData = data; render(); positionBanner(); })
                .catch(() => { banner.style.display = 'none'; });
        })();

        // Optional article search (removed from Evolved chrome; keep handlers only if present)
        if (searchInput) {
            let searchTimeout;
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.trim();
                clearTimeout(searchTimeout);
                searchInput.setAttribute('aria-expanded', query ? 'true' : 'false');
                searchTimeout = setTimeout(() => searchArticles(query), 300);
            });
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    if (searchResults) searchResults.classList.add('hidden');
                    articlesGrid.style.display = 'grid';
                }
            });
        }

    </script>
</body>
</html>
