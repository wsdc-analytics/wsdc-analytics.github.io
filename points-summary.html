<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WSDC Points Summary - Full event reports catalog. WSDC Registry points by event, division, and placement.">
    <title>Points Summary | WSDC Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preload" href="static/data/points_summaries.json" as="fetch" crossorigin>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LMLCY5PE8Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LMLCY5PE8Z');
    </script>
    <style>
        :root {
            --color-primary: #1a1d24;
            --color-primary-dark: #0f1115;
            --color-accent: #2563eb;
            --color-accent-soft: rgba(37, 99, 235, 0.08);
            --medal-gold: #c9a227;
            --medal-silver: #8e8e8e;
            --medal-bronze: #a67c52;
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-card-hover: #fafbfc;
            --text-primary: #1a1d24;
            --text-secondary: #5a6578;
            --text-tertiary: #8b95a5;
            --border-color: #e2e8f0;
            --shadow-soft: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-card: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02);
            --shadow-card-hover: 0 8px 24px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.03);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .back-link {
            color: var(--color-accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color var(--transition);
        }
        .back-link:hover { color: #1d4ed8; }
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 48px 24px 80px;
        }
        h1 {
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--color-primary-dark);
        }
        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 40px;
        }
        .summary-date {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 40px 0 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .summary-date:first-of-type { margin-top: 0; }
        .event-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            margin-bottom: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: box-shadow var(--transition), border-color var(--transition);
        }
        .event-card:hover { box-shadow: var(--shadow-card-hover); border-color: #cbd5e1; }
        .event-card.expanded { border-color: #cbd5e1; box-shadow: var(--shadow-card-hover); }
        .event-card { scroll-margin-top: 20px; }
        .event-header {
            padding: 18px 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: background var(--transition);
        }
        .event-header:hover { background: var(--bg-card-hover); }
        .event-header .chevron {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            color: var(--text-tertiary);
            transition: transform var(--transition), color var(--transition);
        }
        .event-card.expanded .event-header .chevron { transform: rotate(180deg); color: var(--color-accent); }
        .event-name { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
        .event-meta { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .event-body {
            padding: 0 22px 24px;
            border-top: 1px solid var(--border-color);
            background: linear-gradient(180deg, var(--bg-tertiary) 0%, var(--bg-primary) 100%);
        }
        .event-body.collapsed { display: none; }
        .event-body:not(.collapsed) { animation: fadeSlide 0.25s ease; }
        @keyframes fadeSlide {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }
        .divisions-grid {
            display: grid;
            gap: 20px;
            padding-top: 20px;
        }
        .division-block {
            background: var(--bg-primary);
            border-radius: var(--radius-sm);
            padding: 16px 18px;
            border-left: 4px solid var(--color-accent);
            box-shadow: var(--shadow-soft);
        }
        .division-block.champions { border-left-color: var(--medal-gold); }
        .division-block.allstars { border-left-color: var(--medal-silver); }
        .division-block.advanced { border-left-color: #3b82f6; }
        .division-title {
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }
        .place-row {
            padding: 8px 0;
            font-size: 15px;
            line-height: 1.5;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            align-items: baseline;
        }
        .place-row.place-1 { padding-left: 14px; border-left: 3px solid var(--medal-gold); }
        .place-row.place-2 { padding-left: 14px; border-left: 3px solid var(--medal-silver); }
        .place-row.place-3 { padding-left: 14px; border-left: 3px solid var(--medal-bronze); }
        .place-label {
            font-weight: 600;
            font-size: 14px;
            min-width: 100px;
            color: var(--text-secondary);
        }
        .place-content { flex: 1; min-width: 0; }
        .loading, .empty, .error {
            text-align: center;
            padding: 64px 24px;
            color: var(--text-secondary);
            font-size: 16px;
        }
    </style>
</head>
<body>
    <header class="header">
        <a href="index.html" class="back-link">&larr; Home</a>
        <span style="color: var(--text-tertiary);">|</span>
        <span style="font-size: 14px;">Points Summary</span>
    </header>

    <div class="container">
        <h1>WSDC Points Summary</h1>
        <p class="subtitle">Full event reports catalog. Registry points by event, division, and placement.</p>
        <main id="catalog"></main>
    </div>

    <script>
        const catalog = document.getElementById('catalog');
        catalog.innerHTML = '<div class="loading">Loading...</div>';

        fetch('static/data/points_summaries.json')
            .then(r => {
                if (!r.ok) throw new Error('Failed to fetch');
                return r.json();
            })
            .then(data => {
                const summaries = data.summaries || [];
                if (summaries.length === 0) {
                    catalog.innerHTML = '<div class="empty">No summaries yet. Data is populated when the results bot runs.</div>';
                    return;
                }
                catalog.innerHTML = summaries.map(s => renderSummary(s)).join('');
                document.querySelectorAll('.event-header').forEach(el => {
                    el.addEventListener('click', () => {
                        const card = el.closest('.event-card');
                        const body = el.nextElementSibling;
                        body.classList.toggle('collapsed');
                        card.classList.toggle('expanded', !body.classList.contains('collapsed'));
                    });
                });
                const hash = window.location.hash.slice(1);
                if (hash && hash.startsWith('event-')) {
                    const target = document.getElementById(hash);
                    if (target) {
                        const body = target.querySelector('.event-body');
                        if (body) body.classList.remove('collapsed');
                        target.classList.add('expanded');
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            })
            .catch(() => {
                catalog.innerHTML = '<div class="error">Could not load data. Open the page through a web server.</div>';
            });

        function renderSummary(s) {
            const eventsByContinent = {};
            (s.events || []).forEach(ev => {
                const c = ev.continent || 'Other';
                if (!eventsByContinent[c]) eventsByContinent[c] = [];
                eventsByContinent[c].push(ev);
            });
            const order = ['Europe', 'America', 'Australia', 'Asia', 'South America', 'Africa', 'Other'];
            let html = `<div class="summary-date">${s.post_date} &mdash; ${s.events_count} event${s.events_count !== 1 ? 's' : ''}</div>`;
            for (const c of order) {
                if (!eventsByContinent[c]) continue;
                for (const ev of eventsByContinent[c]) {
                    html += renderEvent(ev, s.post_date);
                }
            }
            return html;
        }

        function makeEventSlug(name, postDate) {
            if (!name || !postDate) return '';
            const parts = postDate.trim().split('-');
            const datePart = parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : postDate.replace(/-/g, '');
            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            return slug ? `${datePart}-${slug}` : datePart;
        }

        function divClass(division) {
            const n = (division || '').toLowerCase();
            if (n.includes('champion')) return 'champions';
            if (n.includes('all-star')) return 'allstars';
            if (n.includes('advanced')) return 'advanced';
            return '';
        }
        function placeClass(place) {
            if (place === '1') return 'place-1';
            if (place === '2') return 'place-2';
            if (place === '3') return 'place-3';
            return '';
        }
        function renderEvent(ev, postDate) {
            const slug = ev.slug || makeEventSlug(ev.name, postDate);
            let divs = '';
            (ev.divisions || []).forEach(d => {
                let placesHtml = '';
                (d.places || []).forEach(p => {
                    const pc = placeClass(p.place);
                    if (p.leader && p.follower) {
                        placesHtml += `<div class="place-row ${pc}"><span class="place-label">${p.place_label}:</span><span class="place-content">${escapeHtml(p.leader)} & ${escapeHtml(p.follower)}</span></div>`;
                    } else if (p.leaders && p.leaders.length) {
                        const label = (p.place === 'F' && p.points_leader) ? `Finalists Leaders (+${p.points_leader}):` : (p.place_label || '');
                        placesHtml += `<div class="place-row ${pc}"><span class="place-label">${label}</span><span class="place-content">${escapeHtml(p.leaders.join(', '))}</span></div>`;
                    }
                    if (p.followers && p.followers.length) {
                        const label = (p.place === 'F' && p.points_follower) ? `Finalists Followers (+${p.points_follower}):` : (p.place_label || '');
                        placesHtml += `<div class="place-row ${pc}"><span class="place-label">${label}</span><span class="place-content">${escapeHtml(p.followers.join(', '))}</span></div>`;
                    }
                });
                divs += `<div class="division-block ${divClass(d.division)}"><div class="division-title">${escapeHtml(d.division)}</div>${placesHtml}</div>`;
            });
            return `
                <div class="event-card" id="event-${slug || ''}">
                    <div class="event-header">
                        <div>
                            <div class="event-name">${ev.flag || ''} ${escapeHtml(ev.name)}</div>
                            <div class="event-meta">${escapeHtml(ev.location)} &middot; ${escapeHtml(ev.dates)}</div>
                        </div>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
                    </div>
                    <div class="event-body collapsed">
                        <div class="divisions-grid">${divs}</div>
                    </div>
                </div>`;
        }

        function escapeHtml(s) {
            if (s == null) return '';
            const div = document.createElement('div');
            div.textContent = s;
            return div.innerHTML;
        }
    </script>
</body>
</html>
