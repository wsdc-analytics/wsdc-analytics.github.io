<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WSDC KPI Dashboard - interactive West Coast Swing analytics">
    <title>WSDC KPI Dashboard | WSDC Analytics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="static/css/tokens.css">
    <link rel="stylesheet" href="static/css/site-chrome.css">
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LMLCY5PE8Z"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LMLCY5PE8Z');
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            overflow: hidden;
            height: 100%;
        }
        body {
            font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--wsdc-color-surface, #fff);
            color: var(--wsdc-color-text, #1f2937);
            line-height: 1.6;
        }
        .page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .dash-chrome {
            flex-shrink: 0;
        }
.viz-frame {
            flex: 1;
            min-height: 0;
            margin: 10px 16px 16px;
            border: 1px solid var(--wsdc-color-border, #d1d5db);
            border-radius: 12px;
            background: var(--wsdc-color-surface, #fff);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .viz-viewport {
            flex: 1;
            min-height: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }
        .viz-scaled {
            transform-origin: center center;
        }
        .viz-scaled .tableauPlaceholder {
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="dash-chrome">
            <div data-site-chrome data-active="dashboards" data-lang="en" data-home-href="index.html" data-current-dash="dashboard.html"></div>
                        <a class="wsdc-back" href="index.html?lang=en" data-wsdc-back id="backLink">Back to home</a>
</div>

        <div class="viz-frame">
            <div class="viz-viewport" id="vizViewport">
                <div class="viz-scaled" id="vizScaled">
                    <div class='tableauPlaceholder' id='viz1770821220405' style='position: relative'>
                        <noscript>
                            <a href='#'>
                                <img alt='KPIsDashboard ' src='https://public.tableau.com/static/images/WS/WSDCnew/KPIsDashboard/1_rss.png' style='border: none' />
                            </a>
                        </noscript>
                        <object class='tableauViz' style='display:none;'>
                            <param name='host_url' value='https%3A%2F%2Fpublic.tableau.com%2F' />
                            <param name='embed_code_version' value='3' />
                            <param name='site_root' value='' />
                            <param name='name' value='WSDCnew&#47;KPIsDashboard' />
                            <param name='tabs' value='no' />
                            <param name='toolbar' value='yes' />
                            <param name='static_image' value='https://public.tableau.com/static/images/WS/WSDCnew/KPIsDashboard/1.png' />
                            <param name='animate_transition' value='yes' />
                            <param name='display_static_image' value='yes' />
                            <param name='display_spinner' value='yes' />
                            <param name='display_overlay' value='yes' />
                            <param name='display_count' value='yes' />
                            <param name='language' value='en-US' />
                        </object>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="static/js/site-chrome.js" defer></script>
    <script type='text/javascript'>
        var VIZ_WIDTH = 1600;
        var VIZ_HEIGHT = 1127;

        function fitViz() {
            var viewport = document.getElementById('vizViewport');
            var scaled = document.getElementById('vizScaled');
            var availableW = viewport.clientWidth;
            var availableH = viewport.clientHeight;
            var scale = Math.min(availableW / VIZ_WIDTH, availableH / VIZ_HEIGHT);
            scale = Math.min(scale, 1);
            scaled.style.transform = 'scale(' + scale + ')';
        }

        var divElement = document.getElementById('viz1770821220405');
        var vizElement = divElement.getElementsByTagName('object')[0];
        vizElement.style.width = VIZ_WIDTH + 'px';
        vizElement.style.height = VIZ_HEIGHT + 'px';

        var scriptElement = document.createElement('script');
        scriptElement.src = 'https://public.tableau.com/javascripts/api/viz_v1.js';
        vizElement.parentNode.insertBefore(scriptElement, vizElement);

        scriptElement.onload = function() {
            fitViz();
            var iframe = divElement.querySelector('iframe');
            if (iframe) {
                iframe.style.width = VIZ_WIDTH + 'px';
                iframe.style.height = VIZ_HEIGHT + 'px';
            }
        };

        window.addEventListener('resize', fitViz);
    </script>
</body>
</html>
