    <script>
(function () {
  "use strict";

  var I18N = {
    en: {
      title: "Events Calendar",
      subtitle: "Year overview of WSDC registry and trial events. Day fill shows how many events overlap that date (1–2 / 3–4 / 5+). Click a day for the map and cards. Past years and past days are muted; today is outlined.",
      year: "Year",
      continent: "Continent",
      country: "Country",
      status: "Status",
      allContinents: "All continents",
      allCountries: "All countries",
      allStatuses: "All statuses",
      close: "Close",
      legDens1: "1–2",
      legDens2: "3–4",
      legDens3: "5+",
      legDensity: "events/day",
      legEmpty: "Empty day",
      legToday: "Today",
      empty: "No day-precision events for this year yet.",
      day: "Day",
      noGeo: "Some events have no coordinates - listed below only.",
      website: "Event website",
      starts: "Starts",
      ends: "Ends",
      location: "Location",
      projected: "Projected from",
      registry: "Registry Event",
      trial: "Trial Event",
      continents: { America: "America", Europe: "Europe", Asia: "Asia", Australia: "Australia" },
      statuses: { confirmed: "Confirmed", expected: "Expected", cancelled: "Cancelled", hiatus: "Hiatus" },
      months: ["January","February","March","April","May","June","July","August","September","October","November","December"],
      dow: ["M","T","W","T","F","S","S"]
    },
    ru: {
      title: "Календарь ивентов",
      subtitle: "Годовой обзор registry и trial ивентов WSDC. Заливка дня = сколько ивентов пересекаются с датой (1–2 / 3–4 / 5+). Клик открывает карту и карточки. Прошлые годы и прошедшие дни приглушены, сегодня — обведено.",
      year: "Год",
      continent: "Континент",
      country: "Страна",
      status: "Статус",
      allContinents: "Все континенты",
      allCountries: "Все страны",
      allStatuses: "Все статусы",
      close: "Закрыть",
      legDens1: "1–2",
      legDens2: "3–4",
      legDens3: "5+",
      legDensity: "ивентов/день",
      legEmpty: "Пустой день",
      legToday: "Сегодня",
      empty: "Для этого года пока нет дат с точностью до дня.",
      day: "День",
      noGeo: "У части ивентов нет координат - только список.",
      website: "Сайт ивента",
      starts: "Старт",
      ends: "Конец",
      location: "Локация",
      projected: "Проекция с",
      registry: "Registry Event",
      trial: "Trial Event",
      continents: { America: "Америка", Europe: "Европа", Asia: "Азия", Australia: "Австралия" },
      statuses: { confirmed: "Подтверждён", expected: "Ожидается", cancelled: "Отменён", hiatus: "Hiatus" },
      months: ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],
      dow: ["П","В","С","Ч","П","С","В"]
    },
    es: {
      title: "Calendario de eventos",
      subtitle: "Vista anual de eventos registry y trial de WSDC. El color del dia indica cuantos eventos coinciden (1–2 / 3–4 / 5+). Haz clic para el mapa y las fichas. Los años y dias pasados se atenúan; hoy va marcado.",
      year: "Año",
      continent: "Continente",
      country: "País",
      status: "Estado",
      allContinents: "Todos los continentes",
      allCountries: "Todos los países",
      allStatuses: "Todos los estados",
      close: "Cerrar",
      legDens1: "1–2",
      legDens2: "3–4",
      legDens3: "5+",
      legDensity: "eventos/día",
      legEmpty: "Dia vacío",
      legToday: "Hoy",
      empty: "Aún no hay eventos con fecha exacta para este año.",
      day: "Dia",
      noGeo: "Algunos eventos no tienen coordenadas - solo en la lista.",
      website: "Sitio del evento",
      starts: "Inicio",
      ends: "Fin",
      location: "Ubicación",
      projected: "Proyectado desde",
      registry: "Registry Event",
      trial: "Trial Event",
      continents: { America: "América", Europe: "Europa", Asia: "Asia", Australia: "Australia" },
      statuses: { confirmed: "Confirmado", expected: "Previsto", cancelled: "Cancelado", hiatus: "Hiatus" },
      months: ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"],
      dow: ["L","M","X","J","V","S","D"]
    }
  };

  var CONTINENTS = ["America", "Europe", "Asia", "Australia"];
  var STATUSES = ["confirmed", "expected", "cancelled", "hiatus"];

  var state = {
    lang: "en",
    data: null,
    year: null,
    continent: "",
    country: "",
    status: "",
    byDay: {},
    selectedDay: null,
    map: null,
    markers: null
  };

  function t(key) {
    var pack = I18N[state.lang] || I18N.en;
    return pack[key] || I18N.en[key] || key;
  }

  function applyStaticI18n() {
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var key = el.getAttribute("data-i18n");
      el.textContent = t(key);
    });
    document.documentElement.lang = state.lang;
    if (state.data && state.data.disclaimer) {
      document.getElementById("disclaimer").textContent =
        state.data.disclaimer[state.lang] || state.data.disclaimer.en || "";
    }
  }

  function eventsForYear(year) {
    return (state.data.events || []).filter(function (e) {
      if (e.year !== year) return false;
      if (state.continent && e.continent !== state.continent) return false;
      if (state.country && e.country !== state.country) return false;
      if (state.status && e.status !== state.status) return false;
      return true;
    });
  }

  function eventsInYearRaw(year) {
    return (state.data.events || []).filter(function (e) { return e.year === year; });
  }

  function continentLabel(key) {
    var pack = (I18N[state.lang] || I18N.en).continents || {};
    return pack[key] || key;
  }

  function statusLabel(key) {
    var pack = (I18N[state.lang] || I18N.en).statuses || {};
    return pack[key] || key;
  }

  function fillSelect(sel, options, selected, allLabel) {
    sel.innerHTML = "";
    var all = document.createElement("option");
    all.value = "";
    all.textContent = allLabel;
    sel.appendChild(all);
    options.forEach(function (opt) {
      var el = document.createElement("option");
      el.value = opt.value;
      el.textContent = opt.label;
      if (opt.value === selected) el.selected = true;
      sel.appendChild(el);
    });
    if (selected && !options.some(function (o) { return o.value === selected; })) {
      all.selected = true;
    }
  }

  function refreshFilterOptions() {
    var continents = (state.data && state.data.continents) || CONTINENTS;
    var contSel = document.getElementById("continentFilter");
    fillSelect(
      contSel,
      continents.map(function (c) { return { value: c, label: continentLabel(c) }; }),
      state.continent,
      t("allContinents")
    );

    var yearEvents = eventsInYearRaw(state.year).filter(function (e) {
      if (state.continent && e.continent !== state.continent) return false;
      return true;
    });
    var countries = {};
    yearEvents.forEach(function (e) {
      if (e.country) countries[e.country] = true;
    });
    var countryList = Object.keys(countries).sort(function (a, b) {
      return a.localeCompare(b);
    });
    if (state.country && countries[state.country] !== true) {
      state.country = "";
    }
    fillSelect(
      document.getElementById("countryFilter"),
      countryList.map(function (c) { return { value: c, label: c }; }),
      state.country,
      t("allCountries")
    );

    var statusPool = yearEvents.filter(function (e) {
      if (state.country && e.country !== state.country) return false;
      return true;
    });
    var statusPresent = {};
    statusPool.forEach(function (e) {
      if (e.status) statusPresent[e.status] = true;
    });
    var statusOpts = STATUSES.filter(function (s) { return statusPresent[s]; }).map(function (s) {
      return { value: s, label: statusLabel(s) };
    });
    if (state.status && statusPresent[state.status] !== true) {
      state.status = "";
    }
    fillSelect(
      document.getElementById("statusFilter"),
      statusOpts,
      state.status,
      t("allStatuses")
    );
  }

  function isoFromDate(d) {
    var y = d.getFullYear();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function eachIsoDay(startIso, endIso, fn) {
    var start = new Date(startIso + "T12:00:00");
    var end = new Date((endIso || startIso) + "T12:00:00");
    if (isNaN(start.getTime()) || isNaN(end.getTime())) return;
    if (end < start) end = new Date(start);
    for (var d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      fn(isoFromDate(d));
    }
  }

  function indexByDay(events, year) {
    var map = {};
    events.forEach(function (e) {
      var start = e.start_date;
      if (!start) return;
      var end = e.end_date || e.start_date;
      eachIsoDay(start, end, function (iso) {
        if (parseInt(iso.slice(0, 4), 10) !== year) return;
        if (!map[iso]) map[iso] = [];
        map[iso].push(e);
      });
    });
    return map;
  }

  function renderYearSelect() {
    var sel = document.getElementById("yearSelect");
    sel.innerHTML = "";
    (state.data.years || []).forEach(function (y) {
      var opt = document.createElement("option");
      opt.value = String(y);
      opt.textContent = String(y);
      if (y === state.year) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  function renderCalendar() {
    var root = document.getElementById("calendarRoot");
    var events = eventsForYear(state.year);
    state.byDay = indexByDay(events, state.year);
    if (!events.length) {
      root.innerHTML = '<div class="empty-year">' + t("empty") + "</div>";
      return;
    }
    var months = t("months");
    var dow = t("dow");
    var now = new Date();
    var todayIso = isoFromDate(now);
    var currentYear = now.getFullYear();
    var yearIsPast = state.year < currentYear;
    var yearIsCurrent = state.year === currentYear;
    var html = '<div class="year-grid">';
    for (var m = 0; m < 12; m++) {
      var monthPast = yearIsPast || (yearIsCurrent && m < now.getMonth());
      html += '<section class="month' + (monthPast ? " is-past-month" : "") + '"><h2>' + months[m] + "</h2>";
      html += '<div class="dow" aria-hidden="true">' + dow.map(function (d) { return "<span>" + d + "</span>"; }).join("") + "</div>";
      html += '<div class="days">';
      var first = new Date(state.year, m, 1);
      var startPad = (first.getDay() + 6) % 7; // Mon-first
      var daysInMonth = new Date(state.year, m + 1, 0).getDate();
      var cells = [];
      var i;
      for (i = 0; i < startPad; i++) {
        cells.push({ empty: true });
      }
      for (var day = 1; day <= daysInMonth; day++) {
        var iso = state.year + "-" + String(m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
        var list = state.byDay[iso] || [];
        var occupied = list.length > 0;
        var dens = 0;
        if (occupied) {
          if (list.length >= 5) dens = 3;
          else if (list.length >= 3) dens = 2;
          else dens = 1;
        }
        cells.push({
          empty: false,
          day: day,
          iso: iso,
          occupied: occupied,
          dens: dens,
          count: list.length,
          selected: occupied && state.selectedDay === iso,
          today: yearIsCurrent && iso === todayIso,
          past: yearIsPast || (yearIsCurrent && iso < todayIso)
        });
      }
      while (cells.length < 42) {
        cells.push({ empty: true });
      }
      for (i = 0; i < cells.length; i++) {
        var c = cells[i];
        if (c.empty) {
          html += '<div class="day is-empty" aria-hidden="true"></div>';
          continue;
        }
        var cls = "day";
        if (c.occupied) cls += " has-events is-occupied dens-" + c.dens;
        if (c.selected) cls += " is-selected";
        if (c.today) cls += " is-today";
        if (c.past) cls += " is-past";
        html += '<button type="button" class="' + cls + '" data-date="' + c.iso + '"' +
          (c.occupied ? "" : " disabled") +
          ' aria-label="' + c.iso + (c.occupied ? ", " + c.count + " events" : "") +
          (c.today ? ", today" : "") + '">';
        html += "<span>" + c.day + "</span>";
        html += "</button>";
      }
      html += "</div></section>";
    }
    html += "</div>";
    root.innerHTML = html;
    root.querySelectorAll(".day.has-events").forEach(function (btn) {
      btn.addEventListener("click", function () {
        openDay(btn.getAttribute("data-date"));
      });
      btn.addEventListener("mouseenter", function (ev) {
        showTooltip(ev, btn.getAttribute("data-date"));
      });
      btn.addEventListener("mousemove", function (ev) {
        moveTooltip(ev);
      });
      btn.addEventListener("mouseleave", hideTooltip);
      btn.addEventListener("focus", function (ev) {
        showTooltip(ev, btn.getAttribute("data-date"));
      });
      btn.addEventListener("blur", hideTooltip);
    });
  }

  function showTooltip(ev, dayIso) {
    var tip = document.getElementById("tooltip");
    var list = state.byDay[dayIso] || [];
    if (!list.length) return;
    tip.innerHTML = list.slice(0, 8).map(function (e) {
      var where = [e.city, e.country].filter(Boolean).join(", ");
      var span = esc(e.start_date) + (e.end_date && e.end_date !== e.start_date ? " - " + esc(e.end_date) : "");
      return "<div><strong>" + esc(e.name) + "</strong>" +
        (where ? " - " + esc(where) : "") +
        '<div class="status-line">' + span + " · " + esc(e.status) + " · " + esc(e.kind) + "</div></div>";
    }).join("");
    if (list.length > 8) tip.innerHTML += "<div>… +" + (list.length - 8) + "</div>";
    tip.classList.add("is-visible");
    moveTooltip(ev);
  }

  function moveTooltip(ev) {
    var tip = document.getElementById("tooltip");
    if (!tip.classList.contains("is-visible")) return;
    var pad = 8;
    var gap = 12;
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var cx = ev.clientX || 0;
    var cy = ev.clientY || 0;
    // Place off-screen first so layout size is measurable without flicker jump
    tip.style.left = "0px";
    tip.style.top = "0px";
    var w = tip.offsetWidth;
    var h = tip.offsetHeight;
    var x = cx + gap;
    var y = cy + gap;
    if (x + w > vw - pad) x = cx - w - gap;
    if (x < pad) x = pad;
    if (x + w > vw - pad) x = Math.max(pad, vw - pad - w);
    if (y + h > vh - pad) y = cy - h - gap;
    if (y < pad) y = pad;
    if (y + h > vh - pad) y = Math.max(pad, vh - pad - h);
    tip.style.left = Math.round(x) + "px";
    tip.style.top = Math.round(y) + "px";
    tip.style.transformOrigin = (y < cy ? "bottom left" : "top left");
  }

  function hideTooltip() {
    document.getElementById("tooltip").classList.remove("is-visible");
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function eventsForDay(iso) {
    return state.byDay[iso] || [];
  }

  function ensureMap() {
    if (state.map) return;
    state.map = L.map("weekendMap", { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap",
      maxZoom: 18
    }).addTo(state.map);
    state.markers = L.layerGroup().addTo(state.map);
  }

  function statusColor(status) {
    if (status === "confirmed") return "#16a34a";
    if (status === "expected") return "#9ca3af";
    if (status === "cancelled") return "#dc2626";
    if (status === "hiatus") return "#d97706";
    return "#64748b";
  }

  function openDay(iso) {
    hideTooltip();
    state.selectedDay = iso;
    renderCalendar();
    var events = eventsForDay(iso);
    var panel = document.getElementById("weekendPanel");
    panel.classList.add("is-open");
    document.body.classList.add("panel-open");
    document.getElementById("weekendTitle").textContent = t("day") + " " + iso;

    ensureMap();
    state.markers.clearLayers();
    var withGeo = events.filter(function (e) {
      return typeof e.lat === "number" && typeof e.lon === "number";
    });
    var note = document.getElementById("noGeoNote");
    if (withGeo.length < events.length) {
      note.hidden = false;
      note.textContent = t("noGeo");
    } else {
      note.hidden = true;
    }
    if (withGeo.length) {
      var bounds = [];
      withGeo.forEach(function (e) {
        var m = L.circleMarker([e.lat, e.lon], {
          radius: 8,
          color: "#fff",
          weight: 1,
          fillColor: statusColor(e.status),
          fillOpacity: 0.9
        });
        m.bindPopup(esc(e.name));
        m.on("click", function () { selectEvent(e.id); });
        state.markers.addLayer(m);
        bounds.push([e.lat, e.lon]);
      });
      state.map.fitBounds(bounds, { padding: [28, 28], maxZoom: 5 });
    } else {
      state.map.setView([20, 0], 1);
    }
    setTimeout(function () { state.map.invalidateSize(); }, 50);

    var list = document.getElementById("eventList");
    list.innerHTML = events.map(function (e) {
      var where = [e.city, e.country].filter(Boolean).join(", ");
      var span = esc(e.start_date) + (e.end_date && e.end_date !== e.start_date ? " - " + esc(e.end_date) : "");
      return '<button type="button" class="event-card" data-id="' + esc(e.id) + '">' +
        "<h3>" + esc(e.name) + "</h3>" +
        '<div class="event-meta">' + span + (where ? " · " + esc(where) : "") + "</div>" +
        '<div class="badges">' +
        '<span class="badge ' + esc(e.status) + '">' + esc(statusLabel(e.status)) + "</span>" +
        '<span class="badge ' + (e.kind === "trial" ? "trial" : "") + '">' +
        esc(e.kind === "trial" ? t("trial") : t("registry")) + "</span>" +
        "</div></button>";
    }).join("");
    list.querySelectorAll(".event-card").forEach(function (btn) {
      btn.addEventListener("click", function () {
        selectEvent(btn.getAttribute("data-id"));
      });
    });
    document.getElementById("eventDetail").classList.remove("is-open");
    document.getElementById("eventDetail").innerHTML = "";
  }

  function selectEvent(id) {
    var events = eventsForYear(state.year);
    var e = events.find(function (x) { return x.id === id; });
    if (!e) {
      e = eventsInYearRaw(state.year).find(function (x) { return x.id === id; });
    }
    if (!e) return;
    document.querySelectorAll(".event-card").forEach(function (c) {
      c.classList.toggle("is-active", c.getAttribute("data-id") === id);
    });
    var detail = document.getElementById("eventDetail");
    var where = [e.city, e.country].filter(Boolean).join(", ");
    var html = "<h3>" + esc(e.name) + "</h3>" +
      '<p class="event-meta">' + t("starts") + ": " + esc(e.start_date) +
      (e.end_date ? " · " + t("ends") + ": " + esc(e.end_date) : "") + "</p>";
    if (where) html += '<p class="event-meta">' + t("location") + ": " + esc(where) + "</p>";
    html += '<div class="badges">' +
      '<span class="badge ' + esc(e.status) + '">' + esc(statusLabel(e.status)) + "</span>" +
      '<span class="badge ' + (e.kind === "trial" ? "trial" : "") + '">' +
      esc(e.kind === "trial" ? t("trial") : t("registry")) + "</span></div>";
    if (e.projected_from_year) {
      html += '<p class="event-meta" style="margin-top:8px">' + t("projected") + " " +
        esc(String(e.projected_from_year)) + " (" + esc(e.projected_from_start || "") + ")</p>";
    }
    if (e.url) {
      html += '<p style="margin-top:10px"><a href="' + esc(e.url) + '" target="_blank" rel="noopener noreferrer">' +
        t("website") + "</a></p>";
    }
    detail.innerHTML = html;
    detail.classList.add("is-open");
  }

  function setYear(y) {
    state.year = y;
    state.selectedDay = null;
    state.country = "";
    document.getElementById("weekendPanel").classList.remove("is-open");
    document.body.classList.remove("panel-open");
    refreshFilterOptions();
    renderCalendar();
  }

  function applyFiltersAndRender() {
    state.selectedDay = null;
    document.getElementById("weekendPanel").classList.remove("is-open");
    document.body.classList.remove("panel-open");
    refreshFilterOptions();
    renderCalendar();
  }

  function boot(data) {
    state.data = data;
    state.year = data.default_year || (data.years && data.years[0]) || new Date().getFullYear();
    if ((data.years || []).indexOf(state.year) === -1 && data.years && data.years.length) {
      state.year = data.years[0];
    }
    applyStaticI18n();
    renderYearSelect();
    refreshFilterOptions();
    renderCalendar();
  }

  document.getElementById("yearSelect").addEventListener("change", function (e) {
    setYear(parseInt(e.target.value, 10));
  });
  document.getElementById("continentFilter").addEventListener("change", function (e) {
    state.continent = e.target.value || "";
    state.country = "";
    applyFiltersAndRender();
  });
  document.getElementById("countryFilter").addEventListener("change", function (e) {
    state.country = e.target.value || "";
    applyFiltersAndRender();
  });
  document.getElementById("statusFilter").addEventListener("change", function (e) {
    state.status = e.target.value || "";
    applyFiltersAndRender();
  });
  document.getElementById("closePanel").addEventListener("click", function () {
    document.getElementById("weekendPanel").classList.remove("is-open");
    document.body.classList.remove("panel-open");
    state.selectedDay = null;
    renderCalendar();
  });

  window.WsdcChrome = window.WsdcChrome || {};
  window.WsdcChrome.onLangChange = function (lang) {
    state.lang = lang;
    applyStaticI18n();
    refreshFilterOptions();
    renderCalendar();
    if (state.selectedDay) openDay(state.selectedDay);
  };
  document.addEventListener("wsdc:langchange", function (ev) {
    if (ev.detail && ev.detail.lang) {
      state.lang = ev.detail.lang;
      applyStaticI18n();
      refreshFilterOptions();
      renderCalendar();
      if (state.selectedDay) openDay(state.selectedDay);
    }
  });

  var stored = localStorage.getItem("wsdc-lang");
  if (stored && I18N[stored]) state.lang = stored;
  var params = new URLSearchParams(window.location.search);
  if (params.get("lang") && I18N[params.get("lang")]) state.lang = params.get("lang");

  fetch("static/data/events_year_calendar.json")
    .then(function (r) {
      if (!r.ok) throw new Error("Failed to load calendar data");
      return r.json();
    })
    .then(boot)
    .catch(function (err) {
      var el = document.createElement("div");
      el.className = "error";
      el.textContent = String(err.message || err);
      document.getElementById("calendarRoot").appendChild(el);
    });
})();
    </script>
</body>
</html>
