<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard for secondary-role points distribution by year and country." />
  <title>Secondary-Role Points Distribution | WSDC Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/ui-primitives.css">
  <link rel="stylesheet" href="static/css/site-chrome.css">
  <link rel="stylesheet" href="static/css/dashboard-shell.css">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .content {
      flex: 1;
      min-height: 0;
      max-width: var(--wsdc-width-chrome, 1200px);
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: var(--wsdc-space-3, 12px) var(--wsdc-space-4, 16px);
      gap: var(--wsdc-space-2, 8px);
      overflow: hidden;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--wsdc-space-2, 8px);
    }
    .data-note {
      color: var(--wsdc-color-text-muted, #4b5563);
    }
    .viz-card {
      border: 1px solid var(--wsdc-color-border, #d1d5db);
      border-radius: var(--wsdc-radius-lg, 10px);
      background: var(--wsdc-color-surface, #fff);
      overflow: hidden;
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .viz-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: var(--wsdc-color-surface, #fff);
      align-items: stretch;
      justify-content: stretch;
    }
    @media (max-width: 900px) {
      html, body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .page {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
      }
      .content {
        padding: 10px 10px 12px;
        min-height: auto;
        overflow: visible;
        gap: 10px;
      }
      .viz-card {
        flex: 0 0 auto;
        min-height: clamp(540px, 72dvh, 760px);
      }
      .viz-frame {
        min-height: clamp(540px, 72dvh, 760px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="dash-chrome">
      <div data-site-chrome data-active="dashboards" data-lang="en" data-home-href="index.html" data-current-dash="secondary_role_distribution_dashboard_en.html"></div>
      <a class="wsdc-back" href="index.html?lang=en" data-wsdc-back id="backLink">Back to home</a>
    </div>

    <section class="content">
      <div class="meta-row">
        <p class="wsdc-pill data-note">Data coverage: fixed snapshots for 2023-2025, plus a live 2026 partial slice (as of 2026-08-26).</p>
        <p class="wsdc-pill is-accent size-note">Size: dancers in selected slice</p>
      </div>

      <section class="viz-card" aria-label="Secondary-role country distribution dashboard">
        <iframe
          class="viz-frame"
          src="interactive_secondary_country_bubble.html?v=20260826-sync"
          title="Secondary-role points distribution by year and country"
          loading="lazy">
        </iframe>
      </section>
    </section>
  </main>
  <script src="static/js/site-chrome.js" defer></script>
</body>
</html>
