<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Dashboard for secondary-role points distribution by year and country." />
  <title>Secondary-Role Points Distribution | WSDC Analytics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/site-chrome.css">
  <style>
    :root {
      --color-primary: #2d3748;
      --bg-primary: #ffffff;
      --bg-secondary: #f7fafc;
      --text-primary: #2d3748;
      --text-secondary: #4a5568;
      --border-color: #e5e7eb;
      --accent: #2563eb;
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: "DM Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--text-primary);
      background: var(--bg-primary);
      line-height: 1.6;
    }
    .page {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .dash-chrome { flex-shrink: 0; }
.header {
      flex-shrink: 0;
      padding: 12px 24px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-separator {
      color: var(--text-secondary);
      opacity: 0.6;
      font-size: 14px;
    }
    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .dashboards-nav { display: flex; align-items: center; }
    .dashboards-nav .dropdown-wrapper { position: relative; }
    .dashboards-nav .dropdown-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-sizing: border-box;
      min-width: 200px;
      height: 36px;
      padding: 0 16px;
      white-space: nowrap;
      background: var(--bg-primary);
      border: 2px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1;
      color: var(--text-secondary);
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease, color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
      font-family: inherit;
    }
    .dashboards-nav .dropdown-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .dashboards-nav .dropdown-btn:focus {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
    .dashboards-nav .dropdown-btn svg {
      transition: transform 0.2s ease;
    }
    .dashboards-nav .dropdown-wrapper.open .dropdown-btn svg {
      transform: rotate(180deg);
    }
    .dashboards-nav .dropdown-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      min-width: 240px;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      padding: 6px;
      list-style: none;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s ease;
    }
    .dashboards-nav .dropdown-wrapper.open .dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .dashboards-nav .dropdown-menu a {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    .dashboards-nav .dropdown-menu a:hover {
      background: var(--bg-secondary);
      color: var(--color-primary);
    }
    .content {
      flex: 1;
      min-height: 0;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 12px 16px;
      gap: 8px;
      overflow: hidden;
    }
    .title {
      font-size: 24px;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .lead {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 920px;
    }
    .data-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 2px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .size-note {
      display: inline-flex;
      align-items: center;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .viz-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      flex: 1;
      min-height: 0;
      display: flex;
    }
    .viz-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
    }
    @media (max-width: 900px) {
      html, body {
        height: auto;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
      }
      .page {
        height: auto;
        min-height: 100dvh;
        overflow: visible;
      }
      .title { font-size: 20px; }
      .lead { font-size: 13px; }
      .header {
        padding: 10px 12px;
        gap: 10px;
        flex-wrap: wrap;
      }
      .header-separator { display: none; }
      .dashboards-nav .dropdown-btn { min-width: 150px; height: 34px; font-size: 13px; }
      .content {
        padding: 10px 10px 12px;
        min-height: auto;
        overflow: visible;
        gap: 10px;
      }
      .data-note {
        display: block;
        border-radius: 10px;
      }
      .meta-row { gap: 6px; }
      .size-note {
        border-radius: 10px;
        white-space: normal;
      }
      .viz-card {
        flex: 0 0 auto;
        min-height: clamp(540px, 72dvh, 760px);
      }
      .viz-frame {
        min-height: clamp(540px, 72dvh, 760px);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="dash-chrome">
      <div data-site-chrome data-active="dashboards" data-lang="en" data-home-href="index.html" data-current-dash="secondary_role_distribution_dashboard_en.html"></div>
                  <a class="wsdc-back" href="index.html?lang=en" data-wsdc-back id="backLink">Back to home</a>
</div>

    <section class="content">

    <div class="meta-row">
      <p class="data-note">Data coverage: fixed snapshots for 2023-2025, plus a live 2026 partial slice (as of 2026-08-14).</p>
      <p class="size-note">Size: dancers in selected slice</p>
    </div>

    <section class="viz-card" aria-label="Secondary-role country distribution dashboard">
      <iframe
        class="viz-frame"
        src="interactive_secondary_country_bubble.html?v=20260814-sync"
        title="Secondary-role points distribution by year and country"
        loading="lazy">
      </iframe>
    </section>
    </section>
  </main>
  <script src="static/js/site-chrome.js" defer></script>
</body>
</html>
